      "Die Streuung der Einzelwerte beschreibt die Standardabweichung (hier sehr ähnlich: 0.74 vs. 0.79). Der SE beschreibt dagegen die Unsicherheit des Mittelwerts als Schätzer – und hängt vor allem von n ab.",
      "Richtig. SE = SD / √n. Bei n = 2 684 ist √n ≈ 52, bei n = 87 ist √n ≈ 9. Der SE ist bei der Großstadtgruppe deshalb ~6-mal kleiner – ihr Mittelwert ist viel präziser bestimmt.",
      "Für den SE gibt es keinen universellen Grenzwert – er muss immer im Verhältnis zur Skala und zum n beurteilt werden."
    ]
  },
  {
    id:"a10",type:"mc",transfer:true,
    title:"🧠 Transfer: Lagemaß bei schiefer Verteilung",
    scenario:`<div class="scenario"><div class="scenario-lbl">📊 Praxisbeispiel – Sozialbericht</div>
      <div class="ctx">Ein Bericht über Einkommen in einem Sozialraum zeigt:<br><br>
        <strong>Mittelwert: 6.800 €</strong> &nbsp;|&nbsp; <strong>Median: 3.200 €</strong> &nbsp;|&nbsp; <strong>SD: 9.400 €</strong>
      </div></div>`,
    question:"Ein Stadtrat fragt: <b>&#8222;Was verdient eine typische Person in diesem Sozialraum?&#8221;</b><br>Welche Antwort ist inhaltlich angemessen?",
    options:[
      "6.800 € – der Mittelwert nutzt alle Datenwerte und ist immer die präziseste Angabe",
      "Beide Angaben beschreiben den typischen Wert gleich gut",
      "3.200 € – die rechtschiefe Verteilung (wenige sehr Reiche) verzerrt den Mittelwert; der Median ist der bessere Wert für &#8222;typisch&#8221;",
      "Keine Angabe sinnvoll – bei so großer SD ist kein Lagemaß zuverlässig"
    ],
    correct:2,
    feedback:[
      "Bei schiefen Verteilungen ist der Mittelwert kein gutes Maß für 'typisch' – er wird von wenigen Extremwerten nach oben gezogen und repräsentiert die Mehrheit schlecht.",
      "Das stimmt nur bei symmetrischen Verteilungen. Die große Differenz zwischen M und Median (3.600 €!) zeigt deutliche Rechtsschiefe.",
      "Richtig. Der Median teilt die Verteilung in zwei gleich große Hälften und ist robust gegenüber Ausreißern. Bei Einkommensdaten ist er deshalb die ehrlichere Aussage.",
      "Hohe SD bedeutet Streuung, macht Lagemaße aber nicht unbrauchbar. Gerade dann ist die Wahl des richtigen Lagemaßes besonders wichtig."
    ]
  }
];

// ===== Engine =====
const TOTAL = items.length;
let state = (() => { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch(e){ return {}; } })();
if (!state.idx && state.idx !== 0) state = { idx:0, points:0, done:{} };

function save(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} }

function setBar(){
  document.getElementById("bar").style.width = (state.idx / TOTAL * 100) + "%";
  document.getElementById("points").textContent = state.points;
  document.getElementById("maxpoints").textContent = TOTAL;
  document.getElementById("idx").textContent = Math.min(state.idx + 1, TOTAL);
  document.getElementById("total").textContent = TOTAL;
}

function render(){
  const it = items[state.idx];
  document.getElementById("title").innerHTML =
    `${state.idx + 1}. ${it.title} ${it.transfer ? '<span class="badge">🧠 TRANSFER</span>' : ""}`;
  document.getElementById("scenario-wrap").innerHTML = it.scenario || "";
  document.getElementById("question").innerHTML = it.question;
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("feedback").className = "";

  const wrap = document.getElementById("options");
  wrap.innerHTML = "";
  const nextBtn = document.getElementById("nextBtn");
  nextBtn.disabled = true;
  document.getElementById("prevBtn").disabled = state.idx === 0;

  it.options.forEach((opt, i) => {
    const row = document.createElement("label");
    row.className = "opt";
    const inp = document.createElement("input");
    inp.type = "radio"; inp.name = it.id; inp.value = i;
    const span = document.createElement("span");
    span.innerHTML = opt;
    row.appendChild(inp); row.appendChild(span);
    row.addEventListener("click", () => {
      const correct = i === it.correct;
      document.querySelectorAll("label.opt").forEach(l => {
        const v = parseInt(l.querySelector("input").value);
        if (v === i) l.classList.add(correct ? "correct" : "incorrect");
        l.querySelector("input").disabled = true;
      });
      const fb = document.getElementById("feedback");
      fb.innerHTML = (correct ? "✓ " : "✗ ") + it.feedback[i];
      fb.className = "fb " + (correct ? "ok" : "bad");
      if (!(it.id in state.done)) {
        state.points += correct ? 1 : 0;
        state.done[it.id] = correct ? "ok" : "no";
        save();
        setBar();  // update points display immediately
      }
      nextBtn.disabled = false;
    });
    wrap.appendChild(row);
  });
  setBar();
}

document.getElementById("nextBtn").addEventListener("click", () => {
  if (state.idx < TOTAL - 1) { state.idx++; save(); render(); }
  else { showDone(); }
});

function showDone(){
  const pct = Math.round(state.points / TOTAL * 100);
  const grade = pct >= 85 ? "Sehr gut" : pct >= 70 ? "Gut" : pct >= 55 ? "Befriedigend" : pct >= 40 ? "Ausreichend" : "Nicht bestanden";
  document.querySelector(".card").innerHTML = `
    <div style="text-align:center;padding:16px 0 8px">
      <div style="font-size:48px;margin-bottom:12px">🎉</div>
      <div style="font-size:28px;font-weight:800;margin-bottom:6px">${state.points} / ${TOTAL} Punkte</div>
      <div style="font-size:15px;color:var(--accent);font-weight:700;margin-bottom:4px">${pct} % · ${grade}</div>
      <div style="font-size:13px;color:var(--muted);margin-top:8px">Übung abgeschlossen. Die Korrektantworten wurden pro Frage angezeigt.</div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:24px">
      <button onclick="resetQuiz()">↺ Neu starten</button>
    </div>`;
  document.getElementById("bar").style.width = "100%";
  document.getElementById("points").textContent = state.points;
}

function resetQuiz(){
  if (confirm("Fortschritt löschen und neu starten?")) {
    try { localStorage.removeItem(LS_KEY); } catch(e){}
    state = { idx:0, points:0, done:{} }; save(); location.reload();
  }
}
document.getElementById("prevBtn").addEventListener("click", () => {
  if (state.idx > 0) { state.idx--; save(); render(); }
});
document.getElementById("resetBtn").addEventListener("click", resetQuiz);

render();
</script>
</body>
</html>
