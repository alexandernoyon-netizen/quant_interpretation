      </div></div>`,

      "Cohen's d beeinflusst nicht die Signifikanzentscheidung – die basiert auf p. Signifikant und trivial können gleichzeitig zutreffen.",
      "Der t-Wert allein sagt nichts über Effektstärke aus. Mit df = 3 998 wird sehr kleiner t signifikant. t und d sind verschiedene Konzepte."

  {

    title:"🧠 Transfer: Levene-Test und Varianzhomogenität",
    scenario:`<div class="scenario"><div class="scenario-lbl">📊 Jamovi-Output · Voraussetzungsprüfung im t-Test</div>
      <div class="jmv"><div class="jmv-h">Levene's Test auf Varianzhomogenität</div>
        <table>
          <tr><th></th><th>F</th><th>df</th><th>df2</th><th>p</th></tr>
          <tr><td>pint</td><td>5.14</td><td>1</td><td>3 974</td><td>.023</td></tr>

        <div class="ann">pint: Politisches Interesse (Skala 1–5). Gruppen: Bildungsniveau hoch vs. niedrig</div>

const TOTAL = items.length;
let state = (() => { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch(e){ return {}; } })();
if (!state.idx && state.idx !== 0) state = { idx:0, points:0, done:{} };

function save(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} }

function setBar(){
  document.getElementById("bar").style.width = (state.idx / TOTAL * 100) + "%";
  document.getElementById("points").textContent = state.points;
  document.getElementById("maxpoints").textContent = TOTAL;
  document.getElementById("idx").textContent = Math.min(state.idx + 1, TOTAL);
  document.getElementById("total").textContent = TOTAL;
}

function render(){
  const it = items[state.idx];
  document.getElementById("title").innerHTML =
    `${state.idx + 1}. ${it.title} ${it.transfer ? '<span class="badge">🧠 TRANSFER</span>' : ""}`;
  document.getElementById("scenario-wrap").innerHTML = it.scenario || "";
  document.getElementById("question").innerHTML = it.question;
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("feedback").className = "";

  const wrap = document.getElementById("options");
  wrap.innerHTML = "";
  const nextBtn = document.getElementById("nextBtn");
  nextBtn.disabled = true;
  document.getElementById("prevBtn").disabled = state.idx === 0;

  it.options.forEach((opt, i) => {
    const row = document.createElement("label");
    row.className = "opt";
    const inp = document.createElement("input");
    inp.type = "radio"; inp.name = it.id; inp.value = i;
    const span = document.createElement("span");
    span.innerHTML = opt;
    row.appendChild(inp); row.appendChild(span);
    row.addEventListener("click", () => {
      const correct = i === it.correct;
      document.querySelectorAll("label.opt").forEach(l => {
        l.querySelector("input").disabled = true;
        if (parseInt(l.querySelector("input").value) === i)
          l.classList.add(correct ? "correct" : "incorrect");
      });
      const fb = document.getElementById("feedback");
      fb.innerHTML = (correct ? "✓ " : "✗ ") + it.feedback[i];
      fb.className = "fb " + (correct ? "ok" : "bad");
      if (!(it.id in state.done)) {
        state.points += correct ? 1 : 0;
        state.done[it.id] = correct ? "ok" : "no";
        save();
        setBar();  // update points display immediately
      }
      nextBtn.disabled = false;
    });
    wrap.appendChild(row);
  });
  setBar();
}

document.getElementById("nextBtn").addEventListener("click", () => {
  if (state.idx < TOTAL - 1) { state.idx++; save(); render(); }
  else { showDone(); }
});

function showDone(){
  const pct = Math.round(state.points / TOTAL * 100);
  const grade = pct >= 85 ? "Sehr gut" : pct >= 70 ? "Gut" : pct >= 55 ? "Befriedigend" : pct >= 40 ? "Ausreichend" : "Nicht bestanden";
  document.querySelector(".card").innerHTML = `
    <div style="text-align:center;padding:16px 0 8px">
      <div style="font-size:48px;margin-bottom:12px">🎉</div>
      <div style="font-size:28px;font-weight:800;margin-bottom:6px">${state.points} / ${TOTAL} Punkte</div>
      <div style="font-size:15px;color:var(--accent);font-weight:700;margin-bottom:4px">${pct} % · ${grade}</div>
      <div style="font-size:13px;color:var(--muted);margin-top:8px">Übung abgeschlossen. Die Korrektantworten wurden pro Frage angezeigt.</div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:24px">
      <button onclick="resetQuiz()">↺ Neu starten</button>
    </div>`;
  document.getElementById("bar").style.width = "100%";
  document.getElementById("points").textContent = state.points;
}

function resetQuiz(){
  if (confirm("Fortschritt löschen und neu starten?")) {
    try { localStorage.removeItem(LS_KEY); } catch(e){}
    state = { idx:0, points:0, done:{} }; save(); location.reload();
  }
}
document.getElementById("prevBtn").addEventListener("click", () => {
  if (state.idx > 0) { state.idx--; save(); render(); }
});
document.getElementById("resetBtn").addEventListener("click", resetQuiz);

render();
</script>
