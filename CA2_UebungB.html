<script>
const CONFIG = {"kurs":"Quantitative Methoden der Sozialforschung · 1. Semester","title":"CA 2 · Übung B: Inferenzstatistik angewandt","subtitle":"t-Test, Konfidenzintervall, ANOVA, Chi², Korrelation","mode":"practice","timeMin":null,"grades":null,"shuffleItems":false,"submit":null,"intro":"<p><b>Übungsmodus mit Sofort-Feedback</b> – Schwerpunkt: t-Test, Konfidenzintervall, Effektstärken, ANOVA, Chi²-Test, Korrelation und Voraussetzungen.</p>\n  <ul class=\"rules\">\n    <li><b>10 Aufgaben</b>, ohne Zeitlimit.</li>\n    <li>Antwort wählen, dann <b>„Antwort prüfen“</b>: Du siehst sofort, ob es stimmt, und warum – auch bei den falschen Optionen.</li>\n    <li>Am Ende gibt es eine Übersicht mit allen Lösungen. Antworten werden bei jedem Durchgang neu gemischt.</li>\n    <li>Wer es unter echten Bedingungen probieren will: Die <b>Probeklausur</b> hat 18 Aufgaben und 40 Minuten – genau wie das CA 2.</li>\n  </ul>\n  <p class=\"note\">Nichts wird gespeichert oder übermittelt.</p>"};
const ITEMS = [{"id":"B01","topic":"t-Test","title":"t-Test – Signifikanzentscheidung","transfer":false,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">t-Test für unabhängige Stichproben</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\"></th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Statistik</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">df</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">p</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Mittl. Diff.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">95 % KI Unt.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">95 % KI Ob.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Cohen's d</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">dem_id · Student's t</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.168</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3 976</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">.866</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.003</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">−0.028</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.033</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.005</td></tr></table><div style=\"font-size:12.5px;color:#475569;margin-top:6px\">Gruppen: Männer vs. Frauen · H₁: μ<sub>Männer</sub> ≠ μ<sub>Frauen</sub> · dem_id: Identifikation mit demokratischen Werten (1–4)</div></div>","q":"Was ist die korrekte Entscheidung auf Basis dieses Outputs?","opts":[["H₀ verwerfen – die t-Statistik ist positiv, also gibt es einen Effekt zugunsten der Männer.","Das Vorzeichen von t zeigt nur die Richtung der Differenz. Über die Entscheidung bestimmt p."],["H₀ verwerfen – bei df = 3 976 ist der Test so präzise, dass jedes Ergebnis zählt.","Auch bei großem N entscheidet der p-Wert. Und p = .866 ist weit von .05 entfernt."],["Unklar – für eine Entscheidung müsste man zuerst den β-Fehler der Studie kennen.","Die Entscheidung folgt aus p und α. Der β-Fehler ist ein Risiko, keine Entscheidungsgrundlage."],["H₀ beibehalten – p = .866 liegt deutlich über .05; kein signifikanter Unterschied.","Richtig. p ≥ .05 → H₀ beibehalten. Auch d = 0.005 zeigt: praktisch kein Unterschied."]],"c":3},{"id":"B02","topic":"Konfidenzintervall","title":"Konfidenzintervall – Enthält es die Null?","transfer":false,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">t-Test (Ausschnitt)</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\"></th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">p</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Mittl. Diff.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">95 % KI Unt.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">95 % KI Ob.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Cohen's d</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">dem_id</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">.866</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.003</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">−0.028</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.033</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.005</td></tr></table><div style=\"font-size:12.5px;color:#475569;margin-top:6px\">Gleicher Vergleich wie in der vorigen Aufgabe (Männer vs. Frauen)</div></div>","q":"Was sagt das 95 %-Konfidenzintervall [−0.028; 0.033] aus?","opts":[["Der Unterschied ist nicht signifikant, denn das Intervall schließt den Wert 0 ein.","Richtig. Liegt die Null im KI, ist „kein Unterschied“ ein plausibler Wert – passend zu p = .866."],["Der Unterschied ist signifikant, weil beide Grenzen des Intervalls sehr nahe bei null liegen.","Nah an null zu liegen ist kein Kriterium. Entscheidend ist, ob die Null im KI liegt – und das tut sie."],["Die wahre Differenz liegt sicher in diesem Bereich; ein Unterschied ist damit ausgeschlossen.","Ein KI gibt keine Sicherheit. Und es enthält auch kleine Werte ungleich null – ausgeschlossen ist ein Unterschied also nicht."],["Das KI reicht bis 0.033, also könnte der Effekt positiv sein – damit ist er relevant.","Dass ein positiver Wert plausibel ist, macht den Effekt nicht relevant. Die Obergrenze ist winzig."]],"c":0},{"id":"B03","topic":"Effektstärke","title":"Effektstärke vs. Signifikanz","transfer":false,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">t-Test für unabhängige Stichproben</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\"></th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Statistik</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">df</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">p</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Mittl. Diff.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">95 % KI Unt.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">95 % KI Ob.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Cohen's d</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">dem_func</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">−6.70</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3 954</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">&lt; .001</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">−0.170</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">−0.220</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">−0.120</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">−0.23</td></tr></table><div style=\"font-size:12.5px;color:#475569;margin-top:6px\">Gruppen: Stadt vs. Land · Richtwerte d: klein ≈ 0.20 · mittel ≈ 0.50 · groß ≈ 0.80</div></div>","q":"Wie ist dieser Befund korrekt einzuordnen?","opts":[["p &lt; .001 belegt einen großen und praktisch hochrelevanten Unterschied zwischen Stadt und Land.","Der p-Wert sagt nichts über die Größe. Die steht in Cohen's d."],["Cohen's d = −0.23 ist so klein, dass das Ergebnis trotz p &lt; .001 nicht signifikant ist.","Über Signifikanz entscheidet p, nicht d. p &lt; .001 ist signifikant."],["Statistisch signifikant, aber praktisch klein: d = −0.23 liegt nahe am Richtwert „klein“.","Richtig. Signifikanz und Effektgröße getrennt berichten: p &lt; .001, d ≈ −0.23 (kleiner Effekt)."],["p-Wert und Cohen's d widersprechen sich hier; das Ergebnis lässt sich nicht interpretieren.","Kein Widerspruch: p sagt „gesichert“, d sagt „klein“. Beides passt zusammen."]],"c":2},{"id":"B04","topic":"ANOVA","title":"ANOVA – F-Test und Effektgröße ω²","transfer":false,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">ANOVA – dem_func</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\"></th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Quadratsumme</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">df</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Mittlere quad. Abw.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">F</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">p</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">ω²</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">bbsr</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">29.5</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">9.825</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">17.5</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">&lt; .001</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.012</td></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Residuen</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">2 217.5</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3 952</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.561</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\"></td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\"></td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\"></td></tr></table><div style=\"font-size:12.5px;color:#475569;margin-top:6px\">bbsr: Siedlungsstruktur (4 Kategorien) · Richtwerte ω²: klein = 0.01 · mittel = 0.06 · groß = 0.14</div></div>","q":"Welche Aussage zu dieser ANOVA ist korrekt?","opts":[["Alle vier Siedlungstypen unterscheiden sich signifikant voneinander in ihrer Zufriedenheit.","Die ANOVA zeigt nur, dass sich mindestens zwei Gruppen unterscheiden. Welche, zeigen Post-hoc-Tests."],["Die Siedlungsstruktur erklärt rund 1,2 % der Varianz – ein kleiner Effekt.","Richtig. ω² = 0.012 ≈ 1,2 % erklärte Varianz, knapp über dem Richtwert „klein“ (0.01)."],["F = 17.5 ist der Mittelwert der Zufriedenheit in der ersten der vier Siedlungsgruppen.","F ist eine Teststatistik (Varianz zwischen / innerhalb der Gruppen), kein Mittelwert."],["Weil p &lt; .001 ist, muss ω² mindestens bei 0.14 liegen, also ein großer Effekt sein.","Signifikanz und Effektgröße sind unabhängig. Bei großem N wird auch ein kleiner Effekt signifikant."]],"c":1},{"id":"B05","topic":"ANOVA","title":"ANOVA – Was folgt nach einem signifikanten Ergebnis?","transfer":false,"scen":"<div style=\"border-left:4px solid #64748b;background:#f8fafc;color:#111;padding:10px 14px;margin:8px 0;border-radius:4px;line-height:1.55\">Eine ANOVA vergleicht die Demokratiezufriedenheit zwischen <b>fünf Altersgruppen</b>:<br><b>F(4, 3 947) = 11.8, p &lt; .001, ω² = 0.011</b></div>","q":"Was wissen wir auf Basis dieses Ergebnisses <b>sicher</b>?","opts":[["Alle fünf Altersgruppen unterscheiden sich in ihrer Zufriedenheit signifikant voneinander.","Das sagt die ANOVA nicht. Sie zeigt nur, dass es irgendwo einen Unterschied gibt."],["Die ANOVA zeigt direkt, welche Gruppen sich unterscheiden; Post-hoc-Tests sind nicht nötig.","Genau das zeigt sie nicht. Dafür braucht es Post-hoc-Tests oder geplante Kontraste."],["Jüngere Befragte sind signifikant unzufriedener mit der Demokratie als ältere Befragte.","Über die Richtung oder bestimmte Gruppen sagt der F-Test nichts aus."],["Mindestens zwei der fünf Altersgruppen unterscheiden sich signifikant voneinander.","Richtig. Mehr verrät ein signifikanter F-Test nicht. Welche Gruppen es sind, klären Post-hoc-Tests."]],"c":3},{"id":"B06","topic":"Chi²-Test","title":"Chi²-Test – Signifikanz und Cramér's V","transfer":false,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">Kreuztabelle · pp01 × Geschlecht</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">pp01</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">männlich</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">weiblich</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Insgesamt</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Ja, mitgearbeitet</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">201</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">87</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">288</td></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Nein</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">1 927</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">1 784</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3 711</td></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Insgesamt</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">2 128</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">1 871</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3 999</td></tr></table></div><div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">χ²-Tests</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\"></th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Wert</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">df</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">p</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">χ²</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">34.3</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">1</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">&lt; .001</td></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">N</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3 999</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\"></td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\"></td></tr></table></div><div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">Nominal</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\"></th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Wert</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Cramér's V</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.093</td></tr></table><div style=\"font-size:12.5px;color:#475569;margin-top:6px\">pp01: In den letzten 12 Monaten in einer Partei mitgearbeitet? · Richtwerte V: .10 klein · .30 mittel · .50 groß</div></div>","q":"Wie ist dieses Ergebnis korrekt einzuordnen?","opts":[["Statistisch signifikant, aber nach Cramér's V (.093) ein sehr schwacher Zusammenhang.","Richtig. p &lt; .001 → signifikant; V = .093 liegt knapp unter „klein“."],["χ² = 34.3 heißt: Das Geschlecht erklärt 34,3 % der Unterschiede in der Parteimitarbeit.","χ² ist eine Teststatistik, kein Prozentwert. Für die Stärke ist Cramér's V zuständig."],["Nicht signifikant, weil Cramér's V unter dem Richtwert von .10 für „klein“ liegt.","V beschreibt die Stärke, p die Signifikanz. p &lt; .001 ist signifikant."],["Weil p &lt; .001 ist, hängen Geschlecht und Parteimitarbeit stark miteinander zusammen.","Ein kleiner p-Wert sagt nichts über die Stärke. Die zeigt Cramér's V – und die ist sehr gering."]],"c":0},{"id":"B07","topic":"Korrelation","title":"Pearson vs. Spearman – welches Maß?","transfer":false,"scen":"<div style=\"border-left:4px solid #64748b;background:#f8fafc;color:#111;padding:10px 14px;margin:8px 0;border-radius:4px;line-height:1.55\">Fragestellung: <i>„Gibt es einen Zusammenhang zwischen Bildungsabschluss (<b>casmin</b>, ordinal, 9 Stufen) und politischem Interesse (<b>pint</b>, fünfstufige Antwortskala)?“</i></div>","q":"Welches Korrelationsmaß ist hier angemessener, und warum?","opts":[["Pearson, weil beide Variablen viele Stufen haben und als Zahlen codiert sind.","Viele Stufen und eine Zahlencodierung machen eine Variable nicht metrisch. casmin bleibt ordinal."],["Pearson, weil Spearman nur für zweistufige (dichotome) Variablen geeignet ist.","Spearman eignet sich für ordinale Daten mit beliebig vielen Stufen."],["Spearman, weil mindestens eine der beiden Variablen nur ordinal skaliert ist.","Richtig. Spearman nutzt nur die Rangordnung – passend für ordinale Variablen wie casmin."],["Keines von beiden, weil Korrelationen bei beiden Variablen metrisches Niveau erfordern.","Das gilt nur für Pearson. Für ordinale Daten gibt es eben Spearman."]],"c":2},{"id":"B08","topic":"Korrelation","title":"Korrelation – Kausalität und r²","transfer":false,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">Korrelationsmatrix</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\"></th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Pearson-r</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">p</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">N</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">age_num × trust_media</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">−.24</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">&lt; .001</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3 663</td></tr></table><div style=\"font-size:12.5px;color:#475569;margin-top:6px\">age_num: Alter in Jahren · trust_media: Vertrauen in Medien (Summenskala) · Richtwerte: .10 klein · .30 mittel · .50 groß</div></div>","q":"Welche Aussage zu diesem Ergebnis ist korrekt?","opts":[["Höheres Alter führt zu weniger Vertrauen in Medien – das zeigt die negative Korrelation.","Eine Korrelation belegt keine Kausalität. Es könnten z. B. Generationeneffekte dahinterstehen."],["Ein kleiner bis mittlerer negativer Zusammenhang; eine Kausalaussage ist nicht möglich.","Richtig. |r| = .24 liegt zwischen „klein“ und „mittel“. Ursache und Wirkung lassen sich aus einer Korrelation nicht ablesen."],["r = −.24 bedeutet, dass das Alter 24 % der Varianz im Medienvertrauen erklärt.","Die erklärte Varianz ist r² = .24² ≈ .06, also rund 6 %."],["Weil p &lt; .001 ist, ist der Zusammenhang stark und praktisch sehr bedeutsam.","Der p-Wert sagt nichts über die Stärke. Die zeigt r – und .24 ist kein starker Zusammenhang."]],"c":1},{"id":"B09","topic":"Signifikanz vs. Relevanz","title":"Signifikanz bei großem N","transfer":false,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">t-Test für unabhängige Stichproben</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\"></th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Statistik</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">df</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">p</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Mittl. Diff.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Cohen's d</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">dem_func</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">2.05</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3 998</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">.041</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.049</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.065</td></tr></table><div style=\"font-size:12.5px;color:#475569;margin-top:6px\">Richtwerte d: klein ≈ 0.20 · mittel ≈ 0.50 · groß ≈ 0.80</div></div>","q":"Was ist bei diesem Ergebnis besonders zu beachten?","opts":[["Bei N ≈ 4 000 wird auch ein winziger Unterschied signifikant; d = 0.065 ist praktisch bedeutungslos.","Richtig. Signifikant (p = .041), aber d = 0.065 liegt weit unter dem Richtwert „klein“."],["Das Ergebnis ist statistisch und praktisch bedeutsam, denn t und p sprechen beide dafür.","t und p zeigen nur, dass der Unterschied statistisch gesichert ist – nicht, dass er groß ist."],["Weil d = 0.065 so klein ist, ist das Ergebnis trotz p = .041 in Wahrheit nicht signifikant.","Signifikanz entscheidet p. p = .041 &lt; .05 ist signifikant – nur eben praktisch kaum relevant."],["t = 2.05 zeigt bei df = 3 998 einen mittleren bis großen Effekt zwischen den Gruppen.","Aus t lässt sich keine Effektgröße ablesen. Die steht in Cohen's d."]],"c":0},{"id":"B10","topic":"Transfer: Voraussetzungen","title":"Transfer: Levene-Test und Varianzhomogenität","transfer":true,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">Levene-Test auf Varianzhomogenität</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\"></th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">F</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">df1</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">df2</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">p</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">pint</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">5.14</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">1</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3 974</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">.023</td></tr></table><div style=\"font-size:12.5px;color:#475569;margin-top:6px\">pint: Politisches Interesse (1–5) · Gruppen: Bildungsniveau hoch vs. niedrig</div></div>","q":"Was bedeutet dieses Ergebnis für die weitere Analyse?","opts":[["Der t-Test ist signifikant, denn der Levene-Test ist mit p = .023 signifikant.","Der Levene-Test prüft eine Voraussetzung, nicht die eigentliche Fragestellung."],["Die Varianzen sind gleich; der Student-t-Test kann daher bedenkenlos verwendet werden.","Umgekehrt: Ein signifikanter Levene-Test (p &lt; .05) zeigt ungleiche Varianzen."],["Der Levene-Test ersetzt den t-Test, sobald er signifikant wird.","Er ersetzt ihn nicht, er hilft nur bei der Wahl der passenden t-Test-Variante."],["Die Varianzen sind ungleich; der Welch-Test wäre die robustere Alternative.","Richtig. p &lt; .05 im Levene-Test → Varianzhomogenität verletzt → Welch-Test verwenden."]],"c":3}];

const $ = id => document.getElementById(id);
const L = 'ABCD';
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = s => { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const EXAM = CONFIG.mode === 'exam';
const noR = t => t.replace(/^Richtig\.\s*/, ''); // Feedback der richtigen Option ohne doppeltes „Richtig.“
const grade = p => { if (!CONFIG.grades) return null; return CONFIG.grades.find(g => p >= g[0])[1]; };

let S;
function init() {
  const order = CONFIG.shuffleItems ? shuffle(ITEMS) : ITEMS.slice();
  S = {
    items: order.map(it => { const perm = shuffle([0, 1, 2, 3]); return { ...it, perm }; }),
    ans: {}, checked: {}, flag: {}, tItem: {}, cur: 0, t0: null, tEnter: null, done: false, timerId: null
  };
}

$('intro').innerHTML = CONFIG.intro;
$('go').onclick = () => {
  init();
  $('start').classList.add('hidden'); $('quiz').classList.remove('hidden');
  if (EXAM) { $('nav').classList.remove('hidden'); $('submitTop').classList.remove('hidden'); }
  S.t0 = Date.now();
  if (CONFIG.timeMin) { $('timer').classList.remove('hidden'); tick(); S.timerId = setInterval(tick, 500); }
  if (EXAM) window.onbeforeunload = e => { if (!S.done) { e.preventDefault(); e.returnValue = ''; } };
  show(0);
};

function tick() {
  const left = CONFIG.timeMin * 60 - (Date.now() - S.t0) / 1000;
  $('timer').textContent = fmt(left);
  $('timer').classList.toggle('warn', left <= 300);
  if (left <= 0) finish(true);
}

function leave() { if (S.tEnter != null) { const id = S.items[S.cur].id; S.tItem[id] = (S.tItem[id] || 0) + (Date.now() - S.tEnter) / 1000; } }

function show(i) {
  leave(); S.cur = i; S.tEnter = Date.now();
  const it = S.items[i], n = S.items.length;
  const chosen = S.ans[it.id], checked = !!S.checked[it.id];
  const opts = it.perm.map((oi, k) => {
    let cls = 'opt';
    if (checked) { if (oi === it.c) cls += ' ok'; else if (oi === chosen) cls += ' no'; }
    else if (oi === chosen) cls += ' sel';
    return `<div class="${cls}" data-oi="${oi}"><span class="lt">${L[k]}</span><div>${it.opts[oi][0]}</div></div>`;
  }).join('');
  let fb = '';
  if (checked) {
    const ok = chosen === it.c;
    fb = `<div class="fb ${ok ? 'ok' : 'no'}"><b>${ok ? 'Richtig.' : 'Leider falsch.'}</b> ${ok ? noR(it.opts[chosen][1]) : it.opts[chosen][1]}${ok ? '' : `<br><br><b>Richtig wäre ${L[it.perm.indexOf(it.c)]}:</b> ${noR(it.opts[it.c][1])}`}</div>`;
  }
  const last = i === n - 1;
  let right;
  if (EXAM) right = last ? `<button id="fin">Abgeben</button>` : `<button id="next">Weiter</button>`;
  else if (!checked) right = `<button id="chk" ${chosen == null ? 'disabled' : ''}>Antwort prüfen</button>`;
  else right = last ? `<button id="fin">Zur Auswertung</button>` : `<button id="next">Nächste Aufgabe</button>`;
  const left = EXAM
    ? `<div style="display:flex;gap:8px"><button class="sec" id="prev" ${i === 0 ? 'disabled' : ''}>Zurück</button><button class="flagbtn ${S.flag[it.id] ? 'on' : ''}" id="flg">${S.flag[it.id] ? '⚑ markiert' : '⚐ markieren'}</button></div>`
    : `<span class="note" style="margin:0">Aufgabe ${i + 1} von ${n}</span>`;

  $('itemcard').className = 'card' + (checked ? ' locked' : '');
  $('itemcard').innerHTML = `
    <div class="ititle"><span>Aufgabe ${i + 1}</span>${EXAM ? '' : `<span class="pill">${it.topic}</span>`}</div>
    <div class="scen">${it.scen}</div>
    <div class="q">${it.q}</div>
    <div id="opts">${opts}</div>${fb}
    <div class="btns">${left}${right}</div>`;

  if (!checked) document.querySelectorAll('#opts .opt').forEach(el => el.onclick = () => choose(+el.dataset.oi));
  const b = (id, f) => { const e = $(id); if (e) e.onclick = f; };
  b('next', () => show(i + 1)); b('prev', () => show(i - 1)); b('fin', () => EXAM ? confirmSubmit() : finish(false));
  b('chk', () => { S.checked[it.id] = true; show(i); });
  b('flg', () => { S.flag[it.id] = !S.flag[it.id]; show(i); });
  $('submitTop').onclick = confirmSubmit;
  progress(); window.scrollTo(0, 0);
}

function choose(oi) {
  const it = S.items[S.cur]; S.ans[it.id] = oi;
  document.querySelectorAll('#opts .opt').forEach(el => el.classList.toggle('sel', +el.dataset.oi === oi));
  const c = $('chk'); if (c) c.disabled = false;
  progress();
}

function progress() {
  const n = S.items.length, a = Object.keys(S.ans).length;
  const done = EXAM ? a : Object.keys(S.checked).length;
  $('progt').textContent = EXAM ? `${a} von ${n} beantwortet` : `${done} von ${n} bearbeitet`;
  $('progb').style.width = (done / n * 100) + '%';
  if (EXAM) $('nav').innerHTML = S.items.map((it, k) =>
    `<button class="${S.ans[it.id] != null ? 'done' : ''} ${k === S.cur ? 'cur' : ''} ${S.flag[it.id] ? 'flag' : ''}" data-k="${k}" title="Aufgabe ${k + 1}">${k + 1}</button>`).join('');
  document.querySelectorAll('#nav button').forEach(el => el.onclick = () => show(+el.dataset.k));
}

function modal(html) { $('modalc').innerHTML = html; $('modal').classList.add('on'); }
function closeModal() { $('modal').classList.remove('on'); }

function confirmSubmit() {
  const open = S.items.map((it, k) => S.ans[it.id] == null ? k + 1 : null).filter(x => x);
  const fl = S.items.map((it, k) => S.flag[it.id] ? k + 1 : null).filter(x => x);
  modal(`<h2 style="margin-top:0;font-size:18px">Wirklich abgeben?</h2>
    ${open.length ? `<p>Noch <b>unbeantwortet</b>: Aufgabe ${open.join(', ')}</p>` : '<p>Alle Aufgaben sind beantwortet.</p>'}
    ${fl.length ? `<p>Noch <b>markiert</b>: Aufgabe ${fl.join(', ')}</p>` : ''}
    <p class="note">Nach der Abgabe sind keine Änderungen mehr möglich.</p>
    <div class="btns"><button class="sec" id="mBack">Zurück zum Test</button><button id="mGo">Jetzt abgeben</button></div>`);
  $('mBack').onclick = closeModal; $('mGo').onclick = () => { closeModal(); finish(false); };
}

async function finish(timeout) {
  if (S.done) return; S.done = true; leave(); clearInterval(S.timerId); window.onbeforeunload = null; closeModal();
  const used = (Date.now() - S.t0) / 1000;
  const n = S.items.length;
  const items = CONFIG.shuffleItems ? S.items.slice().sort((a, b) => ITEMS.findIndex(x => x.id === a.id) - ITEMS.findIndex(x => x.id === b.id)) : S.items;
  const pts = items.reduce((s, it) => s + (S.ans[it.id] === it.c ? 1 : 0), 0);
  const g = grade(pts);

  const rv = items.map((it, k) => {
    const ch = S.ans[it.id], ok = ch === it.c;
    return `<div class="rv"><h3><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '✓ richtig' : (ch == null ? '– keine Antwort' : '✗ falsch')}</span>${it.title}</h3>
      ${ch != null && !ok ? `<div class="line"><b>Deine Antwort:</b> ${it.opts[ch][0]}<br><span style="color:#fca5a5">${it.opts[ch][1]}</span></div>` : ''}
      <div class="line"><b>Richtige Antwort:</b> ${it.opts[it.c][0]}<br><span style="color:#a7f3d0">${noR(it.opts[it.c][1])}</span></div>
      <details><summary>Aufgabe noch einmal ansehen</summary><div class="scen">${it.scen}</div><div class="q">${it.q}</div></details></div>`;
  }).join('');

  $('quiz').classList.add('hidden'); $('result').classList.remove('hidden');
  $('result').innerHTML = `
    <div class="kurs">${CONFIG.kurs}</div><h1>${CONFIG.title} – Auswertung</h1>
    ${timeout ? '<div class="fb no" style="margin-top:10px">Die Zeit ist abgelaufen – der Test wurde automatisch abgegeben.</div>' : ''}
    <div class="card">
      <div class="big">${pts} / ${n} Punkte${g ? `<span class="grade">Note ${g}</span>` : ''}</div>
      <div class="stats"><span>${Math.round(pts / n * 100)} % richtig</span>${CONFIG.timeMin ? `<span>Benötigte Zeit: ${fmt(Math.min(used, CONFIG.timeMin * 60))} von ${CONFIG.timeMin}:00 min</span>` : ''}</div>
      ${g ? '<p class="note">Die Note dient nur zur Orientierung und folgt dem Notenschlüssel des echten CA 2.</p>' : ''}
      <div id="sendstate" class="note"></div>
      <div class="btns" style="justify-content:flex-start"><button id="again">Neuer Durchgang</button></div>
    </div>
    <div class="card"><h2 style="margin:0 0 4px;font-size:18px">Alle Aufgaben mit Lösung</h2>${rv}</div>`;
  $('again').onclick = () => location.reload();
  window.scrollTo(0, 0);

  if (CONFIG.submit) {
    // Anonyme Rückmeldung an ein Google-Formular (Antworten landen in Google Forms / Google Tabellen)
    $('sendstate').textContent = 'Ergebnis wird anonym übermittelt …';
    const G = CONFIG.submit, body = new URLSearchParams();
    body.append(G.fields.test, CONFIG.title);
    body.append(G.fields.punkte, `${pts}/${n}`);
    body.append(G.fields.zeit, fmt(used) + (timeout ? ' (abgelaufen)' : ''));
    items.forEach(it => {
      const ch = S.ans[it.id];
      if (G.fields.items[it.id]) body.append(G.fields.items[it.id], `${ch == null ? 'keine Antwort' : ch === it.c ? 'richtig' : 'falsch (' + 'ABCD'[ch] + ')'} · ${fmt(S.tItem[it.id] || 0)}`);
    });
    try {
      // no-cors: Google beantwortet die Anfrage nicht lesbar – kommt kein Netzwerkfehler, ist sie angekommen
      await fetch(G.action, { method: 'POST', mode: 'no-cors', body });
      $('sendstate').textContent = '✓ Ergebnis wurde anonym übermittelt (ohne Namen, ohne Matrikelnummer).';
    } catch (e) { $('sendstate').textContent = 'Übermittlung hat nicht geklappt – kein Problem, deine Auswertung oben bleibt gültig.'; }
  }
}
}

document.addEventListener('keydown', e => {
  if ($('quiz').classList.contains('hidden') || $('modal').classList.contains('on')) return;
  const it = S.items[S.cur]; if (S.checked[it.id]) return;
  const k = 'abcd'.indexOf(e.key.toLowerCase()); const d = '1234'.indexOf(e.key);
  const idx = k >= 0 ? k : d; if (idx >= 0) choose(it.perm[idx]);
});
</script>
</body>
</html>
