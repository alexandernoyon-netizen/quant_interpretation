<style>

html,body{margin:0;min-height:100%}

\">11</td><td style=\"border:1px solid #334155;padding:3px 8px;text-align:center\">10</td><td style=\"border:1px solid #334155;padding:3px 8px;text-align:center\">9</td><td style=\"border:1px solid #334155;padding:3px 8px;text-align:center\">&lt; 9</td></tr><tr><td style=\"border:1px solid #334155;padding:3px 8px;text-align:center;color:#7dd3fc\">1,0</td><td style=\"border:1px solid #334155;padding:3px 8px;text-align:center;color:#7dd3fc\">1,3</td><td style=\"border:1px solid #334155;padding:3px 8px;text-align:center;color:#7dd3fc\">1,7</td><td style=\"border:1px solid #334155;padding:3px 8px;text-align:center;color:#7dd3fc\">2,0</td><td style=\"border:1px solid #334155;padding:3px 8px;text-align:center;color:#7dd3fc\">2,3</td><td style=\"border:1px solid #334155;padding:3px 8px;text-align:center;color:#7dd3fc\">2,7</td><td style=\"border:1px solid #334155;padding:3px 8px;text-align:center;color:#7dd3fc\">3,0</td><td style=\"border:1px solid #334155;padding:3px 8px;text-align:center;color:#7dd3fc\">3,3</td><td style=\"border:1px solid #334155;padding:3px 8px;text-align:center;color:#7dd3fc\">3,7</td><td style=\"border:1px solid #334155;padding:3px 8px;text-align:center;color:#7dd3fc\">4,0</td><td style=\"border:1px solid #334155;padding:3px 8px;text-align:center;color:#7dd3fc\">5,0</td></tr></table>\n  <p class=\"note\">Tipp: Plane den Durchgang am Stück ein, ohne Unterbrechung. Nichts wird gespeichert oder übermittelt.</p>"};
const ITEMS = [{"id":"P01","topic":"Deskriptivstatistik","title":"Deskriptivstatistik – Vergleich zweier Gruppen","transfer":false,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">Deskriptivstatistik für die Gruppen</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Gruppe</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">N</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Mittelwert</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Median</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Std.-abw.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Std.-fehler</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Stadt</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">2 140</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">7.12</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">7.00</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">1.84</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.040</td></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Land</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">1 815</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">7.31</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">8.00</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">2.06</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.048</td></tr></table><div style=\"font-size:12.5px;color:#475569;margin-top:6px\">Variable <i>lz</i>: Lebenszufriedenheit (0 = ganz und gar unzufrieden … 10 = ganz und gar zufrieden), nach Siedlungstyp</div></div>","q":"Welche Aussage lässt sich aus diesem Output <b>direkt und korrekt</b> ableiten?","opts":[["Die Landbevölkerung ist zufriedener, und weil ihr Std.-fehler größer ist, ist dieser Unterschied besonders sicher.","Ein größerer Std.-fehler heißt sogar weniger Präzision. Über die Signifikanz eines Unterschieds entscheidet erst ein Inferenztest."],["Die Stadtbevölkerung ist zufriedener, weil ihre Standardabweichung kleiner ist und die Werte enger beieinander liegen.","Die Standardabweichung beschreibt die Streuung, nicht die Höhe der Zufriedenheit. Dafür schaut man auf Mittelwert und Median."],["Die Landbevölkerung hat einen etwas höheren Mittelwert (7.31 vs. 7.12), ihre Werte streuen aber etwas stärker.","Richtig. Mittelwert höher, Std.-abw. größer (2.06 vs. 1.84). Ob der Unterschied über die Stichprobe hinaus gilt, sagt Deskriptivstatistik nicht."],["Der Unterschied zwischen Stadt und Land ist statistisch gesichert, weil sich die Mediane um einen ganzen Punkt unterscheiden.","Ein Unterschied in der Stichprobe – ob bei Median oder Mittelwert – ist noch kein statistischer Nachweis. Dafür braucht es einen Test."]],"c":2},{"id":"P02","topic":"z-Werte","title":"z-Wert – Lage in der Verteilung und 68-95-99,7-Regel","transfer":false,"scen":"<div style=\"border-left:4px solid #64748b;background:#f8fafc;color:#111;padding:10px 14px;margin:8px 0;border-radius:4px;line-height:1.55\">Variable <i>lz</i> (Lebenszufriedenheit 0–10) in der Gesamtstichprobe: <b>M = 7.20, SD = 1.90</b><br>Eine befragte Person hat den Wert <b>5.30</b>.<br>Berechnung: z = (5.30 − 7.20) / 1.90 = <b>−1.0</b></div>","q":"Was lässt sich über die Lage dieses Werts aussagen (Normalverteilung vorausgesetzt)?","opts":[["Die Person liegt eine SD unter dem Mittelwert; etwa 16 % der Befragten haben einen noch niedrigeren Wert.","Richtig. Innerhalb ±1 SD liegen ca. 68 %, außerhalb ca. 32 % – davon die Hälfte unten. Also liegen ca. 16 % unter z = −1."],["Die Person liegt einen Skalenpunkt unter dem Mittelwert, also ist sie nur minimal unzufriedener als der Durchschnitt.","z misst den Abstand in Standardabweichungen, nicht in Skalenpunkten. Hier sind es 1.90 Skalenpunkte."],["Die Person liegt eine SD unter dem Mittelwert; nach der Regel haben etwa 32 % der Befragten einen noch niedrigeren Wert.","32 % liegen insgesamt außerhalb von ±1 SD – davon nur die Hälfte (ca. 16 %) unterhalb."],["Ein negativer z-Wert zeigt einen Fehler in der Berechnung, weil Lebenszufriedenheit nicht negativ sein kann.","Ein negativer z-Wert heißt nur: unter dem Mittelwert. Der Rohwert (5.30) bleibt selbstverständlich positiv."]],"c":0},{"id":"P03","topic":"Hypothesenlogik","title":"Hypothesenlogik bei einem nicht signifikanten Ergebnis","transfer":false,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">t-Test für unabhängige Stichproben</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\"></th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Statistik</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">df</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">p</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Mittl. Diff.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">95 % KI Unt.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">95 % KI Ob.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Cohen's d</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">trust_pol · Student's t</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">1.21</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3 951</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">.226</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.040</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">−0.025</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.105</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.04</td></tr></table><div style=\"font-size:12.5px;color:#475569;margin-top:6px\">trust_pol: Vertrauen in die Polizei (1 = gar kein … 5 = sehr großes Vertrauen) · Vergleich Frauen vs. Männer · H₁: μ<sub>Frauen</sub> ≠ μ<sub>Männer</sub></div></div>","q":"Welche H₀ wurde hier geprüft, und was folgt aus p = .226?","opts":[["H₀: Frauen vertrauen der Polizei mehr als Männer; wegen p = .226 wird diese H₀ verworfen.","Die H₀ behauptet das Fehlen eines Unterschieds, keine Richtung. Und p ≥ .05 führt zum Beibehalten, nicht zum Verwerfen."],["H₀: kein Unterschied zwischen Frauen und Männern; sie wird beibehalten, ist aber nicht bewiesen.","Richtig. p = .226 &gt; .05 → H₀ beibehalten. Ein nicht signifikantes Ergebnis zeigt nur, dass kein Unterschied nachgewiesen wurde – nicht, dass es keinen gibt."],["H₀: kein Unterschied; p = .226 bedeutet, dass die H₀ mit 22,6 % Wahrscheinlichkeit wahr ist.","p ist nicht die Wahrscheinlichkeit, dass H₀ wahr ist. p gibt an, wie wahrscheinlich ein solches Ergebnis wäre, wenn H₀ gelten würde."],["H₀: kein Unterschied; da das KI die Null enthält, ist das Ergebnis trotz p = .226 signifikant.","Enthält das KI die Null, ist das Ergebnis gerade nicht signifikant – passend zu p = .226."]],"c":1},{"id":"P04","topic":"Konfidenzintervall","title":"Konfidenzintervall – Breite und Bedeutung","transfer":false,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">Studie A (N = 60)</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\"></th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">p</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Mittl. Diff.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">95 % KI Unt.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">95 % KI Ob.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Cohen's d</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Variable Y</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">.086</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.55</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">−0.08</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">1.18</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.45</td></tr></table></div><div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">Studie B (N = 3 000)</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\"></th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">p</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Mittl. Diff.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">95 % KI Unt.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">95 % KI Ob.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Cohen's d</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Variable Y</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">&lt; .001</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.21</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.14</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.28</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.21</td></tr></table><div style=\"font-size:12.5px;color:#475569;margin-top:6px\">Richtwerte d: klein ≈ 0.20 · mittel ≈ 0.50 · groß ≈ 0.80</div></div>","q":"Was zeigt der Vergleich der beiden Konfidenzintervalle?","opts":[["Studie A findet den größeren Effekt (d = 0.45) und ist deshalb die aussagekräftigere der beiden Studien.","Der Punktwert in A ist größer, aber das breite KI (inkl. Null) zeigt: Die Schätzung ist so unsicher, dass auch „kein Effekt“ plausibel ist."],["Studie B ist nur signifikant, weil ihr KI so eng ist; ein enges KI spricht immer für einen großen Effekt.","Ein enges KI zeigt Präzision, nicht Größe. Der Effekt in B ist klein (d = 0.21)."],["Beide Studien zeigen dasselbe, weil beide KIs fast nur positive Werte enthalten und beide Effekte positiv sind.","Entscheidend ist, ob die Null im KI liegt: bei A ja (nicht signifikant), bei B nein (signifikant)."],["A schätzt sehr unsicher (KI enthält 0, also n. s.); B schätzt präzise einen kleinen, signifikanten Effekt.","Richtig. A: breites KI mit Null → nicht signifikant, wahrer Effekt kann null oder groß sein. B: enges KI ohne Null → signifikant, Effekt klein (d = 0.21)."]],"c":3},{"id":"P05","topic":"ANOVA","title":"ANOVA – Signifikanz, Effektgröße und Post-hoc","transfer":false,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">ANOVA – trust_gov (Vertrauen in die Bundesregierung)</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\"></th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Quadratsumme</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">df</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Mittlere quad. Abw.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">F</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">p</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">ω²</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">age_grp</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">112.6</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">37.5</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">35.9</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">&lt; .001</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.026</td></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Residuen</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">4 127.9</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3 952</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">1.045</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\"></td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\"></td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\"></td></tr></table><div style=\"font-size:12.5px;color:#475569;margin-top:6px\">age_grp: 4 Altersgruppen (18–29, 30–44, 45–64, 65+) · Richtwerte ω²: klein = 0.01 · mittel = 0.06 · groß = 0.14</div></div>","q":"Was ist die korrekte Gesamtaussage zu diesem Ergebnis?","opts":[["F = 35.9 zeigt, dass das Alter rund 36 % der Unterschiede im Regierungsvertrauen erklärt.","F ist eine Teststatistik, kein Prozentwert. Die erklärte Varianz steckt in ω² ≈ 2,6 %."],["Jede Altersgruppe unterscheidet sich signifikant von jeder anderen; das zeigt der F-Test mit p &lt; .001.","Ein signifikanter F-Test zeigt nur, dass sich mindestens zwei Gruppen unterscheiden. Welche, klären Post-hoc-Tests."],["Mindestens zwei Altersgruppen unterscheiden sich; Effekt klein (ω² ≈ 2,6 %); Post-hoc klärt, welche.","Richtig. Signifikant (p &lt; .001), Effekt zwischen „klein“ (0.01) und „mittel“ (0.06), welche Gruppen sich unterscheiden: Post-hoc-Tests."],["Weil ω² unter dem Richtwert für „mittel“ liegt, ist der Altersunterschied nicht signifikant.","Effektgröße und Signifikanz sind zwei verschiedene Fragen. Über Signifikanz entscheidet p."]],"c":2},{"id":"P06","topic":"Signifikanz vs. Relevanz","title":"Signifikanz vs. praktische Relevanz","transfer":false,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">t-Test für unabhängige Stichproben</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\"></th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Statistik</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">df</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">p</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Mittl. Diff.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Cohen's d</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">trust_media</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">2.71</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">8 741</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">.007</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.045</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.06</td></tr></table><div style=\"font-size:12.5px;color:#475569;margin-top:6px\">N gesamt = 8 743 · Vergleich Stadt (n = 5 200) vs. Land (n = 3 543) · trust_media: Vertrauen in Medien (1–5) · Richtwerte d: klein ≈ 0.20 · mittel ≈ 0.50 · groß ≈ 0.80</div></div><div style=\"border-left:4px solid #64748b;background:#f8fafc;color:#111;padding:10px 14px;margin:8px 0;border-radius:4px;line-height:1.55\">Pressemitteilung: <i>„Landbewohner misstrauen den Medien deutlich stärker als Städter – das Ergebnis ist hochsignifikant.“</i></div>","q":"Wie ist diese Pressemitteilung zu bewerten?","opts":[["„Deutlich stärker“ stimmt nicht: Der Unterschied ist signifikant, aber mit d = 0.06 praktisch bedeutungslos.","Richtig. Bei N = 8 743 wird schon ein winziger Unterschied (0.045 Skalenpunkte) signifikant. d = 0.06 liegt weit unter „klein“ (0.20)."],["Die Mitteilung ist korrekt, denn p = .007 zeigt, dass sich Stadt und Land deutlich voneinander unterscheiden.","p beantwortet nur, ob ein Unterschied statistisch gesichert ist – nicht, wie groß er ist."],["Das Ergebnis ist gar nicht signifikant, weil die beiden Gruppen unterschiedlich groß sind (5 200 vs. 3 543).","Ungleiche Gruppengrößen verhindern keine Signifikanz. p = .007 &lt; .05 ist signifikant."],["Die Mitteilung untertreibt sogar: Bei einem p-Wert von .007 ist von einem großen Effekt auszugehen.","Aus dem p-Wert lässt sich keine Effektgröße ablesen. Die steht in Cohen's d – und die ist sehr klein."]],"c":0},{"id":"P07","topic":"Chi²-Test","title":"Chi²-Test – Vollständige Interpretation","transfer":false,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">Kreuztabelle · Ehrenamt × Bildung</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Ehrenamt</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">niedrig</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">hoch</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Insgesamt</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Ja</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">280</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">861</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">1 141</td></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Nein</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">1 320</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">1 538</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">2 858</td></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Insgesamt</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">1 600</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">2 399</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3 999</td></tr></table></div><div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">χ²-Tests</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\"></th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Wert</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">df</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">p</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">χ²</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">159.2</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">1</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">&lt; .001</td></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">N</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3 999</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\"></td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\"></td></tr></table></div><div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">Nominal</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\"></th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Wert</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Cramér's V</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.200</td></tr></table><div style=\"font-size:12.5px;color:#475569;margin-top:6px\">Bildung: niedrig vs. hoch (zweistufig) · Richtwerte V: .10 klein · .30 mittel · .50 groß</div></div>","q":"Welche Aussage beschreibt diesen Befund <b>korrekt und vollständig</b>?","opts":[["Weil χ² mit 159.2 sehr hoch ist, ist der Zusammenhang zwischen Bildung und Ehrenamt stark.","χ² hängt stark von N ab und ist kein Stärkemaß. Die Stärke liest man an Cramér's V ab."],["Bildung verursacht ehrenamtliches Engagement – Hochgebildete engagieren sich, weil ihre Bildung sie gesellschaftlich engagierter macht.","Ein Chi²-Test zeigt einen Zusammenhang, keine Ursache. Andere Faktoren (z. B. Einkommen, Zeit) könnten dahinterstehen."],["Mit V = .200 erklärt Bildung 20 % der Unterschiede im Engagement – ein mittlerer Zusammenhang.","Cramér's V ist kein Prozentanteil erklärter Varianz. Und .20 liegt zwischen „klein“ (.10) und „mittel“ (.30)."],["Bildung und Ehrenamt hängen signifikant zusammen (p &lt; .001); mit V = .20 ist der Zusammenhang klein bis mittel.","Richtig. Signifikanz und Stärke getrennt berichten: p &lt; .001, V = .20 zwischen „klein“ und „mittel“. Kausal ist die Aussage nicht."]],"c":3},{"id":"P08","topic":"Spearman-Korrelation","title":"Spearman-Korrelation – Interpretation","transfer":false,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">Korrelationsmatrix</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\"></th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Spearman-ρ</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">p</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">N</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">age_grp × sm_use</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">−.41</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">&lt; .001</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3 940</td></tr></table><div style=\"font-size:12.5px;color:#475569;margin-top:6px\">age_grp: Altersgruppe (ordinal, 5 Stufen) · sm_use: Nutzung sozialer Medien für politische Informationen (1 = nie … 5 = täglich) · Richtwerte: .10 klein · .30 mittel · .50 groß</div></div>","q":"Welche Aussage zu dieser Korrelation ist <b>korrekt</b>?","opts":[["Weil ρ negativ ist, gibt es keinen Zusammenhang zwischen Alter und Nutzung sozialer Medien.","Das Vorzeichen zeigt die Richtung, nicht ob es einen Zusammenhang gibt. −.41 ist ein deutlicher, negativer Zusammenhang."],["Je älter, desto seltener die Nutzung sozialer Medien dafür; ρ = −.41 ist ein mittlerer Zusammenhang.","Richtig. Negatives Vorzeichen: höhere Altersgruppe ↔ seltenere Nutzung. |ρ| = .41 liegt zwischen „mittel“ und „groß“."],["Ein ρ von −.41 ist nur ein schwacher Zusammenhang, weil der Korrelationskoeffizient kleiner als null ist.","Für die Stärke zählt der Betrag: |−.41| = .41 ist mittel bis groß. Das Minus zeigt nur die Richtung."],["Das Ergebnis beweist, dass ein höheres Alter dazu führt, dass Menschen soziale Medien meiden.","Eine Korrelation belegt keine Kausalität. Dahinter können z. B. Generationeneffekte oder Mediengewohnheiten stehen."]],"c":1},{"id":"P09","topic":"Testauswahl","title":"Testzuordnung – drei Forschungsfragen","transfer":false,"scen":"<div style=\"border-left:4px solid #64748b;background:#f8fafc;color:#111;padding:10px 14px;margin:8px 0;border-radius:4px;line-height:1.55\"><b>A)</b> Unterscheidet sich die Lebenszufriedenheit (metrisch) zwischen Großstadt, Kleinstadt und Dorf (3 Gruppen)?<br><b>B)</b> Hängen Alter in Jahren (metrisch) und Haushaltseinkommen in Euro (metrisch) linear zusammen?<br><b>C)</b> Hängen Siedlungstyp (Stadt/Land) und Parteipräferenz (nominal, 6 Parteien) zusammen?</div>","q":"Welche Testzuordnung für A, B und C ist <b>korrekt</b>?","opts":[["A → drei t-Tests ohne Korrektur · B → Spearman-Korrelation · C → ANOVA","Mehrere t-Tests ohne Korrektur führen zur α-Fehler-Kumulation. Und eine ANOVA braucht eine metrische AV – Parteipräferenz ist nominal."],["A → Chi²-Test · B → t-Test für unabhängige Stichproben · C → Pearson-Korrelation","Chi² vergleicht keine Mittelwerte, ein t-Test vergleicht Gruppen, und Pearson setzt metrische Variablen voraus."],["A → einfaktorielle ANOVA · B → Pearson-Korrelation · C → Chi²-Test auf Unabhängigkeit","Richtig. A: Mittelwertvergleich von mehr als zwei Gruppen. B: linearer Zusammenhang zweier metrischer Variablen. C: zwei nominale Variablen."],["A → t-Test für unabhängige Stichproben · B → Chi²-Test · C → Spearman-Korrelation","Der t-Test ist nur für zwei Gruppen gedacht. Chi² ist für kategoriale, nicht metrische Variablen; Parteipräferenz hat keine Rangfolge."]],"c":2},{"id":"P10","topic":"Transfer: Bericht bewerten","title":"Transfer: Kritische Bewertung eines Forschungsberichts","transfer":true,"scen":"<div style=\"border-left:4px solid #64748b;background:#f8fafc;color:#111;padding:10px 14px;margin:8px 0;border-radius:4px;line-height:1.55\"><i>„In einer Befragung (N = 6 000) hing das Geschlecht signifikant mit der Teilnahme an Demonstrationen zusammen: χ²(1) = 9.6, p = .002, Cramér's V = .04. Außerdem korrelierte das politische Interesse stark mit der Häufigkeit politischer Diskussionen im Freundeskreis: r(5 980) = +.45, p &lt; .001.“</i><br><br>Schlussfolgerung: <b>„Geschlecht ist ein starker Faktor für Protestverhalten, und wer viel diskutiert, entwickelt dadurch mehr politisches Interesse.“</b></div>","q":"Was ist an dieser Schlussfolgerung <b>problematisch</b>?","opts":[["V = .04 ist kein starker Zusammenhang, und aus r = +.45 lässt sich nicht ablesen, was Ursache und was Wirkung ist.","Richtig. V = .04 liegt weit unter „klein“. r = +.45 ist ein mittlerer bis großer Zusammenhang – aber eine Korrelation sagt nichts über die Wirkrichtung."],["Nichts – beide Ergebnisse sind signifikant, also sind auch beide Aussagen der Schlussfolgerung gedeckt.","Signifikanz sagt nichts über Stärke (V = .04 ist trivial) und nichts über Kausalität (Korrelation)."],["r = +.45 ist bei N = 6 000 zu klein, um überhaupt eine Aussage über den Zusammenhang machen zu dürfen.","Nach den Richtwerten ist r = .45 ein mittlerer bis großer Zusammenhang – und klar signifikant."],["Der Chi²-Test war falsch gewählt, denn für Geschlecht und Protestteilnahme hätte man eine Korrelation rechnen müssen.","Für zwei nominale Variablen ist der Chi²-Test genau richtig."]],"c":0},{"id":"P11","topic":"Skalenniveau","title":"Skalenniveau – Konsequenzen für die Analyse","transfer":false,"scen":"<div style=\"border-left:4px solid #64748b;background:#f8fafc;color:#111;padding:10px 14px;margin:8px 0;border-radius:4px;line-height:1.55\">Ein Team analysiert folgende Variablen:<br><b>A)</b> <i>famstand</i>: Familienstand (1 = ledig, 2 = verheiratet, 3 = geschieden, 4 = verwitwet)<br><b>B)</b> <i>eink_grp</i>: Haushaltseinkommen in Gruppen (1 = unter 1 000 € … 6 = über 5 000 €, ungleich breite Klassen)<br><b>C)</b> <i>hh_size</i>: Zahl der Personen im Haushalt</div>","q":"Welche Aussage zum Skalenniveau und zum passenden Lagemaß ist <b>korrekt</b>?","opts":[["famstand ist ordinal, weil die Kategorien durchnummeriert sind; der Median ist dort das passende Lagemaß.","Die Nummerierung ist willkürlich – „verheiratet“ ist nicht „mehr“ als „ledig“. famstand ist nominal (Modus)."],["eink_grp ist metrisch, weil Einkommen in Euro gemessen wird; der Mittelwert der Gruppennummern ist sinnvoll.","Gemessen wurden Einkommensgruppen mit ungleich breiten Klassen – das ist ordinal. Ein Mittelwert der Nummern wäre nicht sinnvoll."],["Alle drei Variablen sind nominal, weil sie nur wenige Ausprägungen haben; überall passt nur der Modus.","Die Zahl der Ausprägungen bestimmt nicht das Skalenniveau. Entscheidend ist, ob es Rangordnung und gleiche Abstände gibt."],["famstand ist nominal (Modus), eink_grp ordinal (Median), hh_size metrisch (hier ist der Mittelwert sinnvoll).","Richtig. Keine Rangfolge → nominal. Rangfolge mit ungleichen Abständen → ordinal. Gleiche Abstände, echter Nullpunkt → metrisch."]],"c":3},{"id":"P12","topic":"Boxplot","title":"Boxplot lesen – Median, Quartile, Ausreißer","transfer":false,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px;margin:8px 0;background:#fff;text-align:center\"><svg viewBox=\"0 0 440 230\" xmlns=\"http://www.w3.org/2000/svg\" width=\"440\" height=\"230\" style=\"max-width:100%;height:auto;background:#fff;font-family:Arial,sans-serif\"><line x1=\"60\" y1=\"14\" x2=\"60\" y2=\"200\" stroke=\"#555\"/><line x1=\"56\" y1=\"60.80000000000001\" x2=\"60\" y2=\"60.80000000000001\" stroke=\"#555\"/><text x=\"52\" y=\"64.80000000000001\" text-anchor=\"end\" font-size=\"11\" fill=\"#333\">58</text><line x1=\"60\" y1=\"60.80000000000001\" x2=\"250\" y2=\"60.80000000000001\" stroke=\"#e5e7eb\" stroke-width=\"0.6\"/><line x1=\"56\" y1=\"99.19999999999999\" x2=\"60\" y2=\"99.19999999999999\" stroke=\"#555\"/><text x=\"52\" y=\"103.19999999999999\" text-anchor=\"end\" font-size=\"11\" fill=\"#333\">42</text><line x1=\"60\" y1=\"99.19999999999999\" x2=\"250\" y2=\"99.19999999999999\" stroke=\"#e5e7eb\" stroke-width=\"0.6\"/><line x1=\"56\" y1=\"106.39999999999999\" x2=\"60\" y2=\"106.39999999999999\" stroke=\"#555\"/><text x=\"52\" y=\"116.19999999999999\" text-anchor=\"end\" font-size=\"11\" fill=\"#333\">39</text><line x1=\"60\" y1=\"106.39999999999999\" x2=\"250\" y2=\"106.39999999999999\" stroke=\"#e5e7eb\" stroke-width=\"0.6\"/><line x1=\"56\" y1=\"128\" x2=\"60\" y2=\"128\" stroke=\"#555\"/><text x=\"52\" y=\"132\" text-anchor=\"end\" font-size=\"11\" fill=\"#333\">30</text><line x1=\"60\" y1=\"128\" x2=\"250\" y2=\"128\" stroke=\"#e5e7eb\" stroke-width=\"0.6\"/><line x1=\"56\" y1=\"164\" x2=\"60\" y2=\"164\" stroke=\"#555\"/><text x=\"52\" y=\"168\" text-anchor=\"end\" font-size=\"11\" fill=\"#333\">15</text><line x1=\"60\" y1=\"164\" x2=\"250\" y2=\"164\" stroke=\"#e5e7eb\" stroke-width=\"0.6\"/><line x1=\"170\" y1=\"60.80000000000001\" x2=\"170\" y2=\"99.19999999999999\" stroke=\"#333\" stroke-dasharray=\"4,2\"/><line x1=\"170\" y1=\"128\" x2=\"170\" y2=\"164\" stroke=\"#333\" stroke-dasharray=\"4,2\"/><line x1=\"150\" y1=\"60.80000000000001\" x2=\"190\" y2=\"60.80000000000001\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"150\" y1=\"164\" x2=\"190\" y2=\"164\" stroke=\"#333\" stroke-width=\"2\"/><rect x=\"125\" y=\"99.19999999999999\" width=\"90\" height=\"28.80000000000001\" fill=\"#dbeafe\" stroke=\"#1d4ed8\" stroke-width=\"2\"/><line x1=\"125\" y1=\"106.39999999999999\" x2=\"215\" y2=\"106.39999999999999\" stroke=\"#1d4ed8\" stroke-width=\"3\"/><circle cx=\"170\" cy=\"190.4\" r=\"4\" fill=\"none\" stroke=\"#e11d48\" stroke-width=\"1.5\"/><circle cx=\"170\" cy=\"44\" r=\"4\" fill=\"none\" stroke=\"#e11d48\" stroke-width=\"1.5\"/><circle cx=\"170\" cy=\"32\" r=\"4\" fill=\"none\" stroke=\"#e11d48\" stroke-width=\"1.5\"/><text x=\"262\" y=\"64.80000000000001\" font-size=\"11\" fill=\"#555\">oberer Whisker (58)</text><text x=\"262\" y=\"103.19999999999999\" font-size=\"11\" fill=\"#1d4ed8\">3. Quartil (42)</text><text x=\"262\" y=\"116.19999999999999\" font-size=\"11\" fill=\"#1d4ed8\" font-weight=\"bold\">Median (39)</text><text x=\"262\" y=\"132\" font-size=\"11\" fill=\"#1d4ed8\">1. Quartil (30)</text><text x=\"262\" y=\"168\" font-size=\"11\" fill=\"#555\">unterer Whisker (15)</text><text x=\"262\" y=\"42\" font-size=\"11\" fill=\"#e11d48\">Ausreißer (65, 70 Std.)</text><text x=\"262\" y=\"194.4\" font-size=\"11\" fill=\"#e11d48\">Ausreißer (4 Std.)</text><text x=\"170\" y=\"222\" text-anchor=\"middle\" font-size=\"12\" fill=\"#333\">work_h (Wochenarbeitsstunden)</text></svg></div>","q":"Was lässt sich aus diesem Boxplot <b>direkt ablesen</b>?","opts":[["Im Durchschnitt arbeiten die Befragten 39 Stunden pro Woche; die meisten arbeiten genau so viel.","Der Boxplot zeigt den Median, nicht den Mittelwert – und nicht, welcher Wert am häufigsten vorkommt (Modus)."],["Die Hälfte der Befragten arbeitet zwischen 15 und 58 Stunden pro Woche, also zwischen den Whiskern.","Zwischen den Whiskern liegen fast alle Werte (ohne Ausreißer). Die mittleren 50 % liegen in der Box: 30 bis 42 Stunden."],["Die mittleren 50 % arbeiten zwischen 30 und 42 Stunden; der Median liegt nah am 3. Quartil.","Richtig. Die Box enthält die mittleren 50 %. Der Median liegt näher am oberen Boxrand – ein Hinweis auf eine eher linksschiefe Verteilung."],["Die Verteilung hat keine Ausreißer nach unten, weil niemand weniger als 15 Stunden arbeitet.","Unten ist ein Ausreißer eingezeichnet (4 Std.). Der untere Whisker zeigt nur den kleinsten Wert, der noch kein Ausreißer ist."]],"c":2},{"id":"P13","topic":"Stichprobenlogik","title":"Stichprobenlogik – Repräsentativität","transfer":false,"scen":"<div style=\"border-left:4px solid #64748b;background:#f8fafc;color:#111;padding:10px 14px;margin:8px 0;border-radius:4px;line-height:1.55\">Ein Nachrichtenportal ruft seine Leser:innen zu einer Online-Umfrage über Vertrauen in die Politik auf. Es nehmen <b>15 000 Personen</b> teil. Das Portal schreibt: „Mit 15 000 Teilnehmenden ist das Ergebnis repräsentativ für Deutschland.“</div>","q":"Was ist an dieser Aussage <b>problematisch</b>?","opts":[["Online-Umfragen sind grundsätzlich unzulässig; Vertrauen in die Politik darf man nur telefonisch erheben.","Auch Online-Befragungen können repräsentativ sein – wenn die Teilnehmenden zufällig aus der Zielpopulation gezogen werden."],["Die Teilnehmenden haben sich selbst ausgewählt; die große Zahl gleicht diese Verzerrung nicht aus.","Richtig. Bei Selbstselektion nehmen v. a. Interessierte und Leser:innen dieses Portals teil. Größe korrigiert keine verzerrte Auswahl."],["15 000 Personen sind zu wenig; für Repräsentativität braucht man mindestens ein Prozent der Bevölkerung.","Repräsentativität hängt nicht vom Anteil an der Bevölkerung ab, sondern vom Auswahlverfahren. Gute Zufallsstichproben haben oft nur 1 000–3 000 Personen."],["Nichts – ab etwa 10 000 Teilnehmenden ist jede Stichprobe repräsentativ, egal wie sie zustande kommt.","Es gibt keine Größe, ab der eine Stichprobe automatisch repräsentativ wird. Entscheidend ist die Auswahl."]],"c":1},{"id":"P14","topic":"Skalenrichtung","title":"Mittelwerte im Output interpretieren","transfer":false,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">Deskriptivstatistik</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\"></th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">trust_pol</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">trust_parl</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">trust_media</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">N</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3 970</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3 958</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3 961</td></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Mittelwert</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">2.08</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3.12</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3.41</td></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Std.-fehler des Mittelwerts</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.014</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.016</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.017</td></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Standardabweichung</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.88</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">1.01</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">1.07</td></tr></table><div style=\"font-size:12.5px;color:#475569;margin-top:6px\">Skala jeweils 1–5 · 1 = volles Vertrauen … 5 = gar kein Vertrauen · pol = Polizei, parl = Bundestag, media = Medien</div></div>","q":"Welcher Institution vertraut die Stichprobe <b>am meisten</b>, und warum?","opts":[["Der Polizei (M = 2.08), weil auf dieser Skala ein niedriger Wert mehr Vertrauen bedeutet.","Richtig. 1 = volles Vertrauen, also zeigt der niedrigste Mittelwert das größte Vertrauen. Immer erst die Skalenrichtung prüfen!"],["Den Medien (M = 3.41), weil hier der höchste Mittelwert der drei Variablen erreicht wird.","Achtung, Skalenrichtung: 5 = gar kein Vertrauen. Der höchste Mittelwert zeigt hier das geringste Vertrauen."],["Den Medien, weil ihre Standardabweichung am größten ist und das Vertrauen dort am meisten streut.","Die Standardabweichung beschreibt, wie unterschiedlich die Antworten sind – nicht, wie hoch das Vertrauen ist."],["Dem Bundestag (M = 3.12), weil sein Mittelwert genau in der Mitte liegt und damit am ausgewogensten ist.","Ein Wert in der Skalenmitte ist nicht „am meisten Vertrauen“. Entscheidend sind Skalenrichtung und Höhe des Mittelwerts."]],"c":0},{"id":"P15","topic":"Konfidenzintervall","title":"Konfidenzintervall im Output – Präzision einschätzen","transfer":false,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">t-Test für unabhängige Stichproben</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\"></th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">p</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Mittl. Diff.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">95 % KI Unt.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">95 % KI Ob.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Cohen's d</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">dem_const</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">&lt; .001</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">−0.14</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">−0.21</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">−0.07</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">−0.16</td></tr></table><div style=\"font-size:12.5px;color:#475569;margin-top:6px\">Vergleich Ost (n = 750) minus West (n = 3 200) · dem_const: Zufriedenheit mit der Verfassung (rekodiert: höher = zufriedener) · Richtwerte d: klein ≈ 0.20 · mittel ≈ 0.50 · groß ≈ 0.80</div></div>","q":"Was lässt sich aus dem Konfidenzintervall [−0.21; −0.07] schließen?","opts":[["Weil beide Grenzen des KI negativ sind, ist der Unterschied zwischen Ost und West nicht signifikant.","Negative Grenzen zeigen nur die Richtung (Ost niedriger). Signifikant ist es, weil die Null nicht im KI liegt."],["95 % der Befragten im Osten sind zwischen 0.07 und 0.21 Punkte weniger zufrieden als im Westen.","Das KI bezieht sich auf die Mittelwertsdifferenz der Gruppen, nicht auf einzelne Personen."],["Weil das KI recht eng ist, handelt es sich um einen großen Unterschied zwischen Ost und West.","Ein enges KI zeigt Präzision, nicht Größe. Laut d = −0.16 ist der Unterschied klein."],["Es enthält die Null nicht (signifikant); der Osten liegt plausibel 0.07 bis 0.21 Punkte darunter.","Richtig. KI ohne Null → signifikant. Die wahre Differenz (Ost minus West) liegt plausibel zwischen −0.21 und −0.07 – ein kleiner Unterschied."]],"c":3},{"id":"P16","topic":"Korrelation & r²","title":"Korrelation – r² und Varianzaufklärung","transfer":false,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">Korrelationsmatrix</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\"></th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Pearson-r</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">p</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">N</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">income × lz</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">+.32</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">&lt; .001</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3 612</td></tr></table><div style=\"font-size:12.5px;color:#475569;margin-top:6px\">income: Haushaltsnettoeinkommen in Euro · lz: Lebenszufriedenheit (0–10) · Richtwerte: .10 klein · .30 mittel · .50 groß</div></div>","q":"Wie viel Varianz der Lebenszufriedenheit hängt mit dem Einkommen zusammen, und wie ist das einzuordnen?","opts":[["32 % – das Einkommen erklärt also ein knappes Drittel der Unterschiede in der Lebenszufriedenheit.","32 % wäre r selbst. Die Varianzaufklärung ist r² = .32² ≈ .10."],["Rund 10 % (r² = .32² ≈ .10) – ein mittlerer Zusammenhang; ca. 90 % bleiben unerklärt.","Richtig. r = .32 ist nach den Richtwerten ein mittlerer Zusammenhang, r² ≈ 10 % erklärte Varianz – der größte Teil hängt mit anderen Faktoren zusammen."],["Rund 10 % – und weil p &lt; .001 ist, belegt das, dass mehr Einkommen zufriedener macht.","Der Wert stimmt, aber eine Korrelation belegt keine Kausalität. Auch die umgekehrte Richtung oder Drittvariablen sind möglich."],["Rund 3 % (r² = .032) – das Einkommen spielt für die Lebenszufriedenheit praktisch keine Rolle.",".32² = .1024, also rund 10 %, nicht 3 %. Nach den Richtwerten ist r = .32 ein mittlerer Zusammenhang."]],"c":1},{"id":"P17","topic":"Fehlerarten","title":"Fehlerarten – α-Fehler und Mehrfachtests","transfer":false,"scen":"<div style=\"border-left:4px solid #64748b;background:#f8fafc;color:#111;padding:10px 14px;margin:8px 0;border-radius:4px;line-height:1.55\">Ein Forschungsteam vergleicht Stadt- und Landbevölkerung in <b>20 verschiedenen Einstellungsvariablen</b> mit je einem t-Test (α = .05). Ein einziger Test wird signifikant (<b>p = .041</b>); die anderen 19 nicht.<br><br>Im Bericht heißt es: <i>„Wir konnten einen bedeutsamen Stadt-Land-Unterschied bei der Einstellung zur Zuwanderung nachweisen.“</i></div>","q":"Was ist an diesem Vorgehen <b>kritisch</b>?","opts":[["Nichts – p = .041 liegt unter .05, also ist der Unterschied bei dieser Variable eindeutig nachgewiesen.","Für einen einzelnen, vorab geplanten Test wäre das so. Bei 20 Tests ist aber ein falsch-positives Ergebnis allein durch Zufall zu erwarten."],["Hier droht ein β-Fehler, weil die 19 nicht signifikanten Tests echte Unterschiede übersehen haben müssen.","Ob die 19 Tests echte Effekte übersehen haben, lässt sich nicht sagen. Das Hauptproblem liegt beim einen signifikanten Ergebnis."],["Bei 20 Tests ist ein Treffer schon per Zufall zu erwarten (α-Fehler-Kumulation); mit Bonferroni n. s.","Richtig. Bei 20 Tests mit α = .05 ist im Schnitt ein falsch-positives Ergebnis zu erwarten. Bonferroni: .05 / 20 = .0025 – p = .041 liegt darüber."],["Man hätte statt 20 t-Tests 20 Chi²-Tests rechnen müssen, dann wäre das Ergebnis eindeutiger gewesen.","Der Testtyp richtet sich nach dem Skalenniveau. Das Problem der vielen Tests bleibt bei jedem Testverfahren bestehen."]],"c":2},{"id":"P18","topic":"Transfer: Studiendesign","title":"Transfer: Studiendesign kritisch bewerten","transfer":true,"scen":"<div style=\"border-left:4px solid #64748b;background:#f8fafc;color:#111;padding:10px 14px;margin:8px 0;border-radius:4px;line-height:1.55\">Eine Querschnittsbefragung (N = 2 400) vergleicht Personen, die im letzten Jahr eine psychosoziale Beratungsstelle genutzt haben, mit Personen ohne Beratung. Die Beratungsnutzenden haben eine <b>geringere Lebenszufriedenheit</b>: <b>t(2 398) = −8.9, p &lt; .001, d = −0.45</b>.<br><br>Fazit eines Lokalpolitikers: <i>„Beratung macht offenbar unglücklich – die Mittel dafür sollten gekürzt werden.“</i></div>","q":"Was ist an diesem Fazit <b>methodisch zu bedenken</b>?","opts":[["Der Unterschied ist mit d = −0.45 zu klein, um überhaupt eine Aussage über Beratung zu erlauben.","d = −0.45 ist fast ein mittlerer Effekt – das Problem ist nicht die Größe, sondern die kausale Deutung."],["Man hätte einen Chi²-Test rechnen müssen, weil Beratungsnutzung (ja/nein) eine nominale Variable ist.","Bei einer zweistufigen Gruppenvariable und metrischer AV (Lebenszufriedenheit) ist der t-Test genau richtig."],["Nichts – bei N = 2 400 und p &lt; .001 ist der negative Effekt der Beratung eindeutig belegt.","Großes N und kleiner p-Wert sichern den Unterschied statistisch ab – aber nicht seine Ursache."],["Ein Querschnitt erlaubt keine Kausalaussage; vermutlich suchen gerade unzufriedene Menschen Beratung.","Richtig. Umgekehrte Kausalität (Selbstselektion in die Beratung) ist naheliegend. Ob Beratung wirkt, könnte z. B. ein Vorher-Nachher-Design mit Kontrollgruppe klären."]],"c":3}];

const $ = id => document.getElementById(id);
const L = 'ABCD';
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = s => { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const EXAM = CONFIG.mode === 'exam';
const noR = t => t.replace(/^Richtig\.\s*/, ''); // Feedback der richtigen Option ohne doppeltes „Richtig.“
const grade = p => { if (!CONFIG.grades) return null; return CONFIG.grades.find(g => p >= g[0])[1]; };

let S;
function init() {
  const order = CONFIG.shuffleItems ? shuffle(ITEMS) : ITEMS.slice();
  S = {
    items: order.map(it => { const perm = shuffle([0, 1, 2, 3]); return { ...it, perm }; }),
    ans: {}, checked: {}, flag: {}, tItem: {}, cur: 0, t0: null, tEnter: null, done: false, timerId: null
  };
}

$('intro').innerHTML = CONFIG.intro;
$('go').onclick = () => {
  init();
  $('start').classList.add('hidden'); $('quiz').classList.remove('hidden');
  if (EXAM) { $('nav').classList.remove('hidden'); $('submitTop').classList.remove('hidden'); }
  S.t0 = Date.now();
  if (CONFIG.timeMin) { $('timer').classList.remove('hidden'); tick(); S.timerId = setInterval(tick, 500); }
  if (EXAM) window.onbeforeunload = e => { if (!S.done) { e.preventDefault(); e.returnValue = ''; } };
  show(0);
};

function tick() {
  const left = CONFIG.timeMin * 60 - (Date.now() - S.t0) / 1000;
  $('timer').textContent = fmt(left);
  $('timer').classList.toggle('warn', left <= 300);
  if (left <= 0) finish(true);
}

function leave() { if (S.tEnter != null) { const id = S.items[S.cur].id; S.tItem[id] = (S.tItem[id] || 0) + (Date.now() - S.tEnter) / 1000; } }

function show(i) {
  leave(); S.cur = i; S.tEnter = Date.now();
  const it = S.items[i], n = S.items.length;
  const chosen = S.ans[it.id], checked = !!S.checked[it.id];
  const opts = it.perm.map((oi, k) => {
    let cls = 'opt';
    if (checked) { if (oi === it.c) cls += ' ok'; else if (oi === chosen) cls += ' no'; }
    else if (oi === chosen) cls += ' sel';
    return `<div class="${cls}" data-oi="${oi}"><span class="lt">${L[k]}</span><div>${it.opts[oi][0]}</div></div>`;
  }).join('');
  let fb = '';
  if (checked) {
    const ok = chosen === it.c;
    fb = `<div class="fb ${ok ? 'ok' : 'no'}"><b>${ok ? 'Richtig.' : 'Leider falsch.'}</b> ${ok ? noR(it.opts[chosen][1]) : it.opts[chosen][1]}${ok ? '' : `<br><br><b>Richtig wäre ${L[it.perm.indexOf(it.c)]}:</b> ${noR(it.opts[it.c][1])}`}</div>`;
  }
  const last = i === n - 1;
  let right;
  if (EXAM) right = last ? `<button id="fin">Abgeben</button>` : `<button id="next">Weiter</button>`;
  else if (!checked) right = `<button id="chk" ${chosen == null ? 'disabled' : ''}>Antwort prüfen</button>`;
  else right = last ? `<button id="fin">Zur Auswertung</button>` : `<button id="next">Nächste Aufgabe</button>`;
  const left = EXAM
    ? `<div style="display:flex;gap:8px"><button class="sec" id="prev" ${i === 0 ? 'disabled' : ''}>Zurück</button><button class="flagbtn ${S.flag[it.id] ? 'on' : ''}" id="flg">${S.flag[it.id] ? '⚑ markiert' : '⚐ markieren'}</button></div>`
    : `<span class="note" style="margin:0">Aufgabe ${i + 1} von ${n}</span>`;

  $('itemcard').className = 'card' + (checked ? ' locked' : '');
  $('itemcard').innerHTML = `
    <div class="ititle"><span>Aufgabe ${i + 1}</span>${EXAM ? '' : `<span class="pill">${it.topic}</span>`}</div>
    <div class="scen">${it.scen}</div>
    <div class="q">${it.q}</div>
    <div id="opts">${opts}</div>${fb}
    <div class="btns">${left}${right}</div>`;

  if (!checked) document.querySelectorAll('#opts .opt').forEach(el => el.onclick = () => choose(+el.dataset.oi));
  const b = (id, f) => { const e = $(id); if (e) e.onclick = f; };
  b('next', () => show(i + 1)); b('prev', () => show(i - 1)); b('fin', () => EXAM ? confirmSubmit() : finish(false));
  b('chk', () => { S.checked[it.id] = true; show(i); });
  b('flg', () => { S.flag[it.id] = !S.flag[it.id]; show(i); });
  $('submitTop').onclick = confirmSubmit;
  progress(); window.scrollTo(0, 0);
}

function choose(oi) {
  const it = S.items[S.cur]; S.ans[it.id] = oi;
  document.querySelectorAll('#opts .opt').forEach(el => el.classList.toggle('sel', +el.dataset.oi === oi));
  const c = $('chk'); if (c) c.disabled = false;
  progress();
}

function progress() {
  const n = S.items.length, a = Object.keys(S.ans).length;
  const done = EXAM ? a : Object.keys(S.checked).length;
  $('progt').textContent = EXAM ? `${a} von ${n} beantwortet` : `${done} von ${n} bearbeitet`;
  $('progb').style.width = (done / n * 100) + '%';
  if (EXAM) $('nav').innerHTML = S.items.map((it, k) =>
    `<button class="${S.ans[it.id] != null ? 'done' : ''} ${k === S.cur ? 'cur' : ''} ${S.flag[it.id] ? 'flag' : ''}" data-k="${k}" title="Aufgabe ${k + 1}">${k + 1}</button>`).join('');
  document.querySelectorAll('#nav button').forEach(el => el.onclick = () => show(+el.dataset.k));
}

function modal(html) { $('modalc').innerHTML = html; $('modal').classList.add('on'); }
function closeModal() { $('modal').classList.remove('on'); }

function confirmSubmit() {
  const open = S.items.map((it, k) => S.ans[it.id] == null ? k + 1 : null).filter(x => x);
  const fl = S.items.map((it, k) => S.flag[it.id] ? k + 1 : null).filter(x => x);
  modal(`<h2 style="margin-top:0;font-size:18px">Wirklich abgeben?</h2>
    ${open.length ? `<p>Noch <b>unbeantwortet</b>: Aufgabe ${open.join(', ')}</p>` : '<p>Alle Aufgaben sind beantwortet.</p>'}
    ${fl.length ? `<p>Noch <b>markiert</b>: Aufgabe ${fl.join(', ')}</p>` : ''}
    <p class="note">Nach der Abgabe sind keine Änderungen mehr möglich.</p>
    <div class="btns"><button class="sec" id="mBack">Zurück zum Test</button><button id="mGo">Jetzt abgeben</button></div>`);
  $('mBack').onclick = closeModal; $('mGo').onclick = () => { closeModal(); finish(false); };
}

async function finish(timeout) {
  if (S.done) return; S.done = true; leave(); clearInterval(S.timerId); window.onbeforeunload = null; closeModal();
  const used = (Date.now() - S.t0) / 1000;
  const n = S.items.length;
  const items = CONFIG.shuffleItems ? S.items.slice().sort((a, b) => ITEMS.findIndex(x => x.id === a.id) - ITEMS.findIndex(x => x.id === b.id)) : S.items;
  const pts = items.reduce((s, it) => s + (S.ans[it.id] === it.c ? 1 : 0), 0);
  const g = grade(pts);

  const rv = items.map((it, k) => {
    const ch = S.ans[it.id], ok = ch === it.c;
    return `<div class="rv"><h3><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '✓ richtig' : (ch == null ? '– keine Antwort' : '✗ falsch')}</span>${it.title}</h3>
      ${ch != null && !ok ? `<div class="line"><b>Deine Antwort:</b> ${it.opts[ch][0]}<br><span style="color:#fca5a5">${it.opts[ch][1]}</span></div>` : ''}
      <div class="line"><b>Richtige Antwort:</b> ${it.opts[it.c][0]}<br><span style="color:#a7f3d0">${noR(it.opts[it.c][1])}</span></div>
      <details><summary>Aufgabe noch einmal ansehen</summary><div class="scen">${it.scen}</div><div class="q">${it.q}</div></details></div>`;
  }).join('');

  $('quiz').classList.add('hidden'); $('result').classList.remove('hidden');
  $('result').innerHTML = `
    <div class="kurs">${CONFIG.kurs}</div><h1>${CONFIG.title} – Auswertung</h1>
    ${timeout ? '<div class="fb no" style="margin-top:10px">Die Zeit ist abgelaufen – der Test wurde automatisch abgegeben.</div>' : ''}
    <div class="card">
      <div class="big">${pts} / ${n} Punkte${g ? `<span class="grade">Note ${g}</span>` : ''}</div>
      <div class="stats"><span>${Math.round(pts / n * 100)} % richtig</span>${CONFIG.timeMin ? `<span>Benötigte Zeit: ${fmt(Math.min(used, CONFIG.timeMin * 60))} von ${CONFIG.timeMin}:00 min</span>` : ''}</div>
      ${g ? '<p class="note">Die Note dient nur zur Orientierung und folgt dem Notenschlüssel des echten CA 2.</p>' : ''}
      <div id="sendstate" class="note"></div>
      <div class="btns" style="justify-content:flex-start"><button id="again">Neuer Durchgang</button></div>
    </div>
    <div class="card"><h2 style="margin:0 0 4px;font-size:18px">Alle Aufgaben mit Lösung</h2>${rv}</div>`;
  $('again').onclick = () => location.reload();
  window.scrollTo(0, 0);

  if (CONFIG.submit) {
    // Anonyme Rückmeldung an ein Google-Formular (Antworten landen in Google Forms / Google Tabellen)
    $('sendstate').textContent = 'Ergebnis wird anonym übermittelt …';
    const G = CONFIG.submit, body = new URLSearchParams();
    body.append(G.fields.test, CONFIG.title);
    body.append(G.fields.punkte, `${pts}/${n}`);
    body.append(G.fields.zeit, fmt(used) + (timeout ? ' (abgelaufen)' : ''));
    items.forEach(it => {
      const ch = S.ans[it.id];
      if (G.fields.items[it.id]) body.append(G.fields.items[it.id], `${ch == null ? 'keine Antwort' : ch === it.c ? 'richtig' : 'falsch (' + 'ABCD'[ch] + ')'} · ${fmt(S.tItem[it.id] || 0)}`);
    });
    try {
      // no-cors: Google beantwortet die Anfrage nicht lesbar – kommt kein Netzwerkfehler, ist sie angekommen
      await fetch(G.action, { method: 'POST', mode: 'no-cors', body });
      $('sendstate').textContent = '✓ Ergebnis wurde anonym übermittelt (ohne Namen, ohne Matrikelnummer).';
    } catch (e) { $('sendstate').textContent = 'Übermittlung hat nicht geklappt – kein Problem, deine Auswertung oben bleibt gültig.'; }
  }
}

document.addEventListener('keydown', e => {
  if ($('quiz').classList.contains('hidden') || $('modal').classList.contains('on')) return;
  const it = S.items[S.cur]; if (S.checked[it.id]) return;
  const k = 'abcd'.indexOf(e.key.toLowerCase()); const d = '1234'.indexOf(e.key);
  const idx = k >= 0 ? k : d; if (idx >= 0) choose(it.perm[idx]);
});
</script>
</body>
</html>
