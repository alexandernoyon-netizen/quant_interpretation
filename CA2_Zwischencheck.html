<script>
const CONFIG = {"kurs":"Quantitative Methoden der Sozialforschung · 1. Semester","title":"CA 2 · Zwischencheck Interpretation","subtitle":"Kurzer Probelauf zu Deskriptiver Statistik – ohne Note, damit wir früh sehen, wo wir stehen.","mode":"exam","timeMin":18,"grades":null,"shuffleItems":true,"submit":{"action":"https://docs.google.com/forms/d/e/1FAIpQLScv7m7WQXk7e7dPDdLjUzTelAhIoK8wpppf8qvpUDVjki4-CQ/formResponse","fields":{"test":"entry.554599272","punkte":"entry.1338700985","zeit":"entry.1970098400","items":{"Z01":"entry.1923175125","Z02":"entry.931181988","Z03":"entry.1340612519","Z04":"entry.1732253703","Z05":"entry.453154514","Z06":"entry.2146097563","Z07":"entry.280311508","Z08":"entry.42760653"}}},"intro":"<p><b>Worum es geht:</b> Ein kurzer Probelauf im Format der Interpretationsaufgabe (CA 2) – nur mit dem Stoff, den wir bisher hatten: Lage- und Streumaße, Verteilungen, Diagramme, Skalenniveau.</p>\n  <ul class=\"rules\">\n    <li><b>8 Aufgaben</b>, je eine richtige Antwort.</li>\n    <li><b>18 Minuten</b> – das ist dasselbe Tempo wie im echten CA 2 (18 Aufgaben in 40 Minuten).</li>\n    <li>Du kannst frei zwischen den Aufgaben springen und Antworten ändern. Feedback gibt es erst nach der Abgabe – dann aber zu jeder Aufgabe.</li>\n    <li><b>Keine Note, keine Bewertung.</b></li>\n  </ul>\n  <p style=\"margin-top:14px\"><b>Anonyme Rückmeldung:</b> Nach der Abgabe wird dein Ergebnis <b>ohne Namen und ohne Matrikelnummer</b> an Prof. Noyon geschickt – nur Punkte, benötigte Zeit und welche Aufgaben richtig oder falsch waren. Damit sehen wir, welche Themen wir vor dem CA 2 noch einmal aufgreifen sollten und ob die Zeit passt.</p>"};
const ITEMS = [{"id":"Z01","topic":"Skalenniveau & Kennwerte","title":"Welche Kennwerte sind sinnvoll?","transfer":false,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">Deskriptivstatistik</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\"></th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">famstand</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">N</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3 962</td></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Mittelwert</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">1.87</td></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Median</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">2.00</td></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Modus</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">2.00</td></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Standardabweichung</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.84</td></tr></table><div style=\"font-size:12.5px;color:#475569;margin-top:6px\">famstand: Familienstand (1 = ledig, 2 = verheiratet, 3 = geschieden, 4 = verwitwet)</div></div>","q":"Jamovi hat alle Kennwerte berechnet. Welche Aussage ist <b>inhaltlich sinnvoll</b>?","opts":[["Im Durchschnitt sind die Befragten „fast verheiratet“, denn der Mittelwert liegt bei 1.87.","Familienstand ist nominal – die Zahlen sind nur Etiketten. Ein Mittelwert von Etiketten ist inhaltlich sinnlos."],["Die Hälfte der Befragten ist ledig oder verheiratet, denn genau das zeigt der Median von 2.00.","Ein Median setzt eine Rangordnung voraus. Die Reihenfolge ledig–verheiratet–geschieden–verwitwet ist willkürlich."],["Am häufigsten kommt „verheiratet“ vor – nur der Modus ist hier sinnvoll interpretierbar.","Richtig. Bei nominalen Variablen ist der Modus das einzige sinnvolle Lagemaß. Jamovi rechnet trotzdem alles aus – interpretieren muss man selbst."],["Die Familienstände unterscheiden sich wenig, weil die Standardabweichung mit 0.84 klein ist.","Auch eine SD setzt metrische Daten voraus. Bei nominalen Variablen beschreibt man die Verteilung über Häufigkeiten."]],"c":2},{"id":"Z02","topic":"Streuungsmaße","title":"Varianz und Standardabweichung","transfer":false,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">Deskriptivstatistik</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\"></th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">dem_func</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">N</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">2 684</td></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Mittelwert</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">2.38</td></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Varianz</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.548</td></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">Standardabweichung</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0.740</td></tr></table><div style=\"font-size:12.5px;color:#475569;margin-top:6px\">dem_func: Zufriedenheit mit dem Funktionieren der Demokratie (1–4); nur Stadtbevölkerung</div></div>","q":"Warum berichtet man in der Regel die Standardabweichung und nicht die Varianz?","opts":[["Die SD hat dieselbe Einheit wie die Skala (Punkte), die Varianz dagegen quadrierte Einheiten.","Richtig. Die Varianz ist die mittlere quadrierte Abweichung; erst die Wurzel daraus (SD) lässt sich in Skalenpunkten lesen."],["Die SD ist robuster gegen Ausreißer als die Varianz und deshalb das zuverlässigere Maß.","Beide reagieren gleich empfindlich auf Ausreißer – die SD ist ja nur die Wurzel der Varianz. Robust wäre der Interquartilsabstand."],["Die Varianz darf man nur bei normalverteilten Daten berechnen, die SD bei allen Daten.","Beide lassen sich für metrische Daten berechnen, unabhängig von der Verteilungsform."],["Bei großen Stichproben wird die Varianz unzuverlässig, die SD bleibt dagegen stabil.","Die Stichprobengröße betrifft beide gleich. Der Unterschied liegt allein in der Einheit."]],"c":0},{"id":"Z03","topic":"Verteilungsform","title":"Histogramm – Form der Verteilung","transfer":false,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px;margin:8px 0;background:#fff;text-align:center\"><svg viewBox=\"0 0 520 250\" xmlns=\"http://www.w3.org/2000/svg\" width=\"520\" height=\"250\" style=\"max-width:100%;height:auto;background:#fff;font-family:Arial,sans-serif\"><line x1=\"50\" y1=\"205\" x2=\"500\" y2=\"205\" stroke=\"#e5e7eb\"/><text x=\"44\" y=\"209\" text-anchor=\"end\" font-size=\"11\" fill=\"#333\">0</text><line x1=\"50\" y1=\"168\" x2=\"500\" y2=\"168\" stroke=\"#e5e7eb\"/><text x=\"44\" y=\"172\" text-anchor=\"end\" font-size=\"11\" fill=\"#333\">5</text><line x1=\"50\" y1=\"131\" x2=\"500\" y2=\"131\" stroke=\"#e5e7eb\"/><text x=\"44\" y=\"135\" text-anchor=\"end\" font-size=\"11\" fill=\"#333\">10</text><line x1=\"50\" y1=\"94\" x2=\"500\" y2=\"94\" stroke=\"#e5e7eb\"/><text x=\"44\" y=\"98\" text-anchor=\"end\" font-size=\"11\" fill=\"#333\">15</text><line x1=\"50\" y1=\"57\" x2=\"500\" y2=\"57\" stroke=\"#e5e7eb\"/><text x=\"44\" y=\"61\" text-anchor=\"end\" font-size=\"11\" fill=\"#333\">20</text><line x1=\"50\" y1=\"20\" x2=\"500\" y2=\"20\" stroke=\"#e5e7eb\"/><text x=\"44\" y=\"24\" text-anchor=\"end\" font-size=\"11\" fill=\"#333\">25</text><rect x=\"52\" y=\"182.8\" width=\"36.90909090909091\" height=\"22.19999999999999\" fill=\"#93c5fd\" stroke=\"#1d4ed8\"/><text x=\"70.45454545454545\" y=\"220\" text-anchor=\"middle\" font-size=\"11\" fill=\"#333\">0</text><rect x=\"92.9090909090909\" y=\"182.8\" width=\"36.90909090909091\" height=\"22.19999999999999\" fill=\"#93c5fd\" stroke=\"#1d4ed8\"/><text x=\"111.36363636363636\" y=\"220\" text-anchor=\"middle\" font-size=\"11\" fill=\"#333\">1</text><rect x=\"133.8181818181818\" y=\"182.8\" width=\"36.90909090909091\" height=\"22.19999999999999\" fill=\"#93c5fd\" stroke=\"#1d4ed8\"/><text x=\"152.27272727272725\" y=\"220\" text-anchor=\"middle\" font-size=\"11\" fill=\"#333\">2</text><rect x=\"174.72727272727272\" y=\"175.4\" width=\"36.90909090909091\" height=\"29.599999999999994\" fill=\"#93c5fd\" stroke=\"#1d4ed8\"/><text x=\"193.1818181818182\" y=\"220\" text-anchor=\"middle\" font-size=\"11\" fill=\"#333\">3</text><rect x=\"215.63636363636363\" y=\"168\" width=\"36.90909090909091\" height=\"37\" fill=\"#93c5fd\" stroke=\"#1d4ed8\"/><text x=\"234.09090909090907\" y=\"220\" text-anchor=\"middle\" font-size=\"11\" fill=\"#333\">4</text><rect x=\"256.5454545454545\" y=\"153.2\" width=\"36.90909090909091\" height=\"51.80000000000001\" fill=\"#93c5fd\" stroke=\"#1d4ed8\"/><text x=\"275\" y=\"220\" text-anchor=\"middle\" font-size=\"11\" fill=\"#333\">5</text><rect x=\"297.45454545454544\" y=\"138.4\" width=\"36.90909090909091\" height=\"66.6\" fill=\"#93c5fd\" stroke=\"#1d4ed8\"/><text x=\"315.9090909090909\" y=\"220\" text-anchor=\"middle\" font-size=\"11\" fill=\"#333\">6</text><rect x=\"338.3636363636364\" y=\"108.8\" width=\"36.90909090909091\" height=\"96.2\" fill=\"#93c5fd\" stroke=\"#1d4ed8\"/><text x=\"356.8181818181818\" y=\"220\" text-anchor=\"middle\" font-size=\"11\" fill=\"#333\">7</text><rect x=\"379.27272727272725\" y=\"20\" width=\"36.90909090909091\" height=\"185\" fill=\"#93c5fd\" stroke=\"#1d4ed8\"/><text x=\"397.7272727272727\" y=\"220\" text-anchor=\"middle\" font-size=\"11\" fill=\"#333\">8</text><rect x=\"420.18181818181813\" y=\"71.80000000000001\" width=\"36.90909090909091\" height=\"133.2\" fill=\"#93c5fd\" stroke=\"#1d4ed8\"/><text x=\"438.63636363636357\" y=\"220\" text-anchor=\"middle\" font-size=\"11\" fill=\"#333\">9</text><rect x=\"461.09090909090907\" y=\"131\" width=\"36.90909090909091\" height=\"74\" fill=\"#93c5fd\" stroke=\"#1d4ed8\"/><text x=\"479.5454545454545\" y=\"220\" text-anchor=\"middle\" font-size=\"11\" fill=\"#333\">10</text><line x1=\"50\" y1=\"205\" x2=\"500\" y2=\"205\" stroke=\"#555\"/><text x=\"275\" y=\"242\" text-anchor=\"middle\" font-size=\"12\" fill=\"#333\">lz: Lebenszufriedenheit (0 = ganz und gar unzufrieden … 10 = ganz und gar zufrieden)</text><text x=\"14\" y=\"112.5\" text-anchor=\"middle\" font-size=\"12\" fill=\"#333\" transform=\"rotate(-90 14 112.5)\">Prozent</text></svg></div>","q":"Welche Aussage trifft auf diese Verteilung zu?","opts":[["Die Verteilung ist rechtsschief; der Mittelwert liegt deshalb über dem Median.","Der lange Ausläufer zeigt hier nach links (zu niedrigen Werten). Das ist linksschief."],["Die Verteilung ist annähernd symmetrisch; Mittelwert und Median sind etwa gleich.","Die meisten Werte liegen rechts, nach links läuft die Verteilung flach aus – das ist nicht symmetrisch."],["Der Modus liegt bei 10, weil die höchsten Werte auf der Skala am häufigsten sind.","Der Modus ist der häufigste Wert: Die höchste Säule ist 8 (25 %), nicht 10."],["Linksschief; wenige sehr Unzufriedene ziehen den Mittelwert unter den Median.","Richtig. Ausläufer nach links → linksschief → Mittelwert (hier 6.8) liegt unter dem Median (8)."]],"c":3},{"id":"Z04","topic":"Diagrammwahl","title":"Welche Darstellung passt?","transfer":false,"scen":"<div style=\"border-left:4px solid #64748b;background:#f8fafc;color:#111;padding:10px 14px;margin:8px 0;border-radius:4px;line-height:1.55\">Eine Gruppe will die Variable <i>party</i> darstellen: <b>„Welche Partei würden Sie wählen?“</b> mit 7 Antwortkategorien (CDU/CSU, SPD, Grüne, FDP, AfD, Linke, Sonstige).</div>","q":"Welche Darstellung ist für diese Variable angemessen?","opts":[["Ein Histogramm, weil damit die Verteilung über alle sieben Kategorien sichtbar wird.","Histogramme sind für metrische Variablen gedacht; die Balken stehen dort für Wertebereiche auf einer Zahlenachse."],["Ein Balkendiagramm mit den Häufigkeiten bzw. Anteilen der sieben Kategorien.","Richtig. Für nominale Variablen eignen sich Balkendiagramme (oder Kreisdiagramme bei wenigen Kategorien)."],["Ein Boxplot, weil er Median, Quartile und Ausreißer der Parteien auf einen Blick zeigt.","Ein Boxplot braucht mindestens ordinale, besser metrische Daten. Parteien haben keine Rangordnung."],["Ein Liniendiagramm, das die sieben Parteien von links nach rechts miteinander verbindet.","Linien suggerieren einen Verlauf oder eine Ordnung. Zwischen Parteikategorien gibt es keinen Verlauf."]],"c":1},{"id":"Z05","topic":"Boxplot","title":"Boxplots im Gruppenvergleich","transfer":false,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px;margin:8px 0;background:#fff;text-align:center\"><svg viewBox=\"0 0 460 260\" xmlns=\"http://www.w3.org/2000/svg\" width=\"460\" height=\"260\" style=\"max-width:100%;height:auto;background:#fff;font-family:Arial,sans-serif\"><line x1=\"60\" y1=\"215\" x2=\"440\" y2=\"215\" stroke=\"#e5e7eb\"/><text x=\"54\" y=\"219\" text-anchor=\"end\" fon solid #ddd;padding:5px 10px;text-align:left\">11.5 %</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">100.0 %</td></tr></table><div style=\"font-size:12.5px;color:#475569;margin-top:6px\">pint: Politisches Interesse (ordinal) · N = 3 955</div></div>","q":"In welcher Kategorie liegt der Median, und warum?","opts":[["In Kategorie 2, weil diese Antwort von den meisten Befragten gewählt wurde.","Das ist der Modus (häufigste Kategorie). Der Median ist der Wert, der die Befragten in zwei Hälften teilt."],["In Kategorie 3 – bei einer fünfstufigen Skala liegt der Median immer in der Mitte.","Der Median hängt von den Antworten ab, nicht von der Skala. Dass es hier 3 ist, liegt an den Häufigkeiten."],["Gar nicht – bei einer Häufigkeitstabelle lässt sich der Median nicht bestimmen.","Doch: Über die kumulativen Prozent lässt er sich direkt ablesen."],["In Kategorie 3, weil die kumulativen Prozent dort erstmals 50 % überschreiten.","Richtig. Bis Kategorie 2 sind es 41,0 %, bis Kategorie 3 schon 62,7 %. Die mittlere Person liegt also in Kategorie 3."]],"c":3},{"id":"Z08","topic":"Transfer: Streuung","title":"Transfer: Mittelwert allein reicht nicht","transfer":true,"scen":"<div style=\"border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;margin:8px 0;background:#fff;color:#111;overflow-x:auto\"><div style=\"font-weight:700;font-size:14px;margin-bottom:4px\">Wartezeit bis zum Erstgespräch (in Wochen)</div><table style=\"border-collapse:collapse;font-size:14px;margin:6px 0;min-width:60%\"><tr><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Beratungsstelle</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">N</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Mittelwert</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Median</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Std.-abw.</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Minimum</th><th style=\"border-bottom:2px solid #333;padding:5px 10px;text-align:left;font-weight:600;background:#f3f4f6\">Maximum</th></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">A</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">214</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">6.1</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">6.0</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">1.2</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">3</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">9</td></tr><tr><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">B</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">198</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">6.0</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">4.5</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">4.8</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">0</td><td style=\"border-bottom:1px solid #ddd;padding:5px 10px;text-align:left\">26</td></tr></table></div><div style=\"border-left:4px solid #64748b;background:#f8fafc;color:#111;padding:10px 14px;margin:8px 0;border-radius:4px;line-height:1.55\">Die Leitung beider Stellen schreibt im Jahresbericht: <i>„Die Wartezeiten in beiden Beratungsstellen sind gleich – im Schnitt rund sechs Wochen.“</i></div>","q":"Was übersieht diese Aussage?","opts":[["Nichts – die Mittelwerte sind fast identisch, also sind auch die Wartezeiten vergleichbar.","Die Mittelwerte sind gleich, die Verteilungen aber völlig verschieden. Genau das unterschlägt die Aussage."],["In B streuen die Wartezeiten stark: Viele warten kürzer, einige aber sehr lange (bis 26 Wochen).","Richtig. SD 4.8 vs. 1.2, Median 4.5 und Maximum 26: In B ist die Wartezeit kaum planbar, und einzelne warten ein halbes Jahr."],["Stelle B ist besser, weil ihr Mittelwert mit 6.0 Wochen leicht unter dem von A liegt.","Der Unterschied von 0.1 Wochen ist bedeutungslos. Entscheidend ist hier die Streuung."],["Bei einer SD von 4.8 warten die meisten Personen in Stelle B ziemlich genau 4.8 Wochen auf ein Gespräch.","Die SD ist keine typische Wartezeit, sondern ein Maß dafür, wie weit die Werte um den Mittelwert streuen."]],"c":1}];

const $ = id => document.getElementById(id);
const L = 'ABCD';
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = s => { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const EXAM = CONFIG.mode === 'exam';
const noR = t => t.replace(/^Richtig\.\s*/, ''); // Feedback der richtigen Option ohne doppeltes „Richtig.“
const grade = p => { if (!CONFIG.grades) return null; return CONFIG.grades.find(g => p >= g[0])[1]; };

let S;
function init() {
  const order = CONFIG.shuffleItems ? shuffle(ITEMS) : ITEMS.slice();
  S = {
    items: order.map(it => { const perm = shuffle([0, 1, 2, 3]); return { ...it, perm }; }),
    ans: {}, checked: {}, flag: {}, tItem: {}, cur: 0, t0: null, tEnter: null, done: false, timerId: null
  };
}

$('intro').innerHTML = CONFIG.intro;
$('go').onclick = () => {
  init();
  $('start').classList.add('hidden'); $('quiz').classList.remove('hidden');
  if (EXAM) { $('nav').classList.remove('hidden'); $('submitTop').classList.remove('hidden'); }
  S.t0 = Date.now();
  if (CONFIG.timeMin) { $('timer').classList.remove('hidden'); tick(); S.timerId = setInterval(tick, 500); }
  if (EXAM) window.onbeforeunload = e => { if (!S.done) { e.preventDefault(); e.returnValue = ''; } };
  show(0);
};

function tick() {
  const left = CONFIG.timeMin * 60 - (Date.now() - S.t0) / 1000;
  $('timer').textContent = fmt(left);
  $('timer').classList.toggle('warn', left <= 300);
  if (left <= 0) finish(true);
}

function leave() { if (S.tEnter != null) { const id = S.items[S.cur].id; S.tItem[id] = (S.tItem[id] || 0) + (Date.now() - S.tEnter) / 1000; } }

function show(i) {
  leave(); S.cur = i; S.tEnter = Date.now();
  const it = S.items[i], n = S.items.length;
  const chosen = S.ans[it.id], checked = !!S.checked[it.id];
  const opts = it.perm.map((oi, k) => {
    let cls = 'opt';
    if (checked) { if (oi === it.c) cls += ' ok'; else if (oi === chosen) cls += ' no'; }
    else if (oi === chosen) cls += ' sel';
    return `<div class="${cls}" data-oi="${oi}"><span class="lt">${L[k]}</span><div>${it.opts[oi][0]}</div></div>`;
  }).join('');
  let fb = '';
  if (checked) {
    const ok = chosen === it.c;
    fb = `<div class="fb ${ok ? 'ok' : 'no'}"><b>${ok ? 'Richtig.' : 'Leider falsch.'}</b> ${ok ? noR(it.opts[chosen][1]) : it.opts[chosen][1]}${ok ? '' : `<br><br><b>Richtig wäre ${L[it.perm.indexOf(it.c)]}:</b> ${noR(it.opts[it.c][1])}`}</div>`;
  }
  const last = i === n - 1;
  let right;
  if (EXAM) right = last ? `<button id="fin">Abgeben</button>` : `<button id="next">Weiter</button>`;
  else if (!checked) right = `<button id="chk" ${chosen == null ? 'disabled' : ''}>Antwort prüfen</button>`;
  else right = last ? `<button id="fin">Zur Auswertung</button>` : `<button id="next">Nächste Aufgabe</button>`;
  const left = EXAM
    ? `<div style="display:flex;gap:8px"><button class="sec" id="prev" ${i === 0 ? 'disabled' : ''}>Zurück</button><button class="flagbtn ${S.flag[it.id] ? 'on' : ''}" id="flg">${S.flag[it.id] ? '⚑ markiert' : '⚐ markieren'}</button></div>`
    : `<span class="note" style="margin:0">Aufgabe ${i + 1} von ${n}</span>`;

  $('itemcard').className = 'card' + (checked ? ' locked' : '');
  $('itemcard').innerHTML = `
    <div class="ititle"><span>Aufgabe ${i + 1}</span>${EXAM ? '' : `<span class="pill">${it.topic}</span>`}</div>
    <div class="scen">${it.scen}</div>
    <div class="q">${it.q}</div>
    <div id="opts">${opts}</div>${fb}
    <div class="btns">${left}${right}</div>`;

  if (!checked) document.querySelectorAll('#opts .opt').forEach(el => el.onclick = () => choose(+el.dataset.oi));
  const b = (id, f) => { const e = $(id); if (e) e.onclick = f; };
  b('next', () => show(i + 1)); b('prev', () => show(i - 1)); b('fin', () => EXAM ? confirmSubmit() : finish(false));
  b('chk', () => { S.checked[it.id] = true; show(i); });
  b('flg', () => { S.flag[it.id] = !S.flag[it.id]; show(i); });
  $('submitTop').onclick = confirmSubmit;
  progress(); window.scrollTo(0, 0);
}

function choose(oi) {
  const it = S.items[S.cur]; S.ans[it.id] = oi;
  document.querySelectorAll('#opts .opt').forEach(el => el.classList.toggle('sel', +el.dataset.oi === oi));
  const c = $('chk'); if (c) c.disabled = false;
  progress();
}

function progress() {
  const n = S.items.length, a = Object.keys(S.ans).length;
  const done = EXAM ? a : Object.keys(S.checked).length;
  $('progt').textContent = EXAM ? `${a} von ${n} beantwortet` : `${done} von ${n} bearbeitet`;
  $('progb').style.width = (done / n * 100) + '%';
  if (EXAM) $('nav').innerHTML = S.items.map((it, k) =>
    `<button class="${S.ans[it.id] != null ? 'done' : ''} ${k === S.cur ? 'cur' : ''} ${S.flag[it.id] ? 'flag' : ''}" data-k="${k}" title="Aufgabe ${k + 1}">${k + 1}</button>`).join('');
  document.querySelectorAll('#nav button').forEach(el => el.onclick = () => show(+el.dataset.k));
}

function modal(html) { $('modalc').innerHTML = html; $('modal').classList.add('on'); }
function closeModal() { $('modal').classList.remove('on'); }

function confirmSubmit() {
  const open = S.items.map((it, k) => S.ans[it.id] == null ? k + 1 : null).filter(x => x);
  const fl = S.items.map((it, k) => S.flag[it.id] ? k + 1 : null).filter(x => x);
  modal(`<h2 style="margin-top:0;font-size:18px">Wirklich abgeben?</h2>
    ${open.length ? `<p>Noch <b>unbeantwortet</b>: Aufgabe ${open.join(', ')}</p>` : '<p>Alle Aufgaben sind beantwortet.</p>'}
    ${fl.length ? `<p>Noch <b>markiert</b>: Aufgabe ${fl.join(', ')}</p>` : ''}
    <p class="note">Nach der Abgabe sind keine Änderungen mehr möglich.</p>
    <div class="btns"><button class="sec" id="mBack">Zurück zum Test</button><button id="mGo">Jetzt abgeben</button></div>`);
  $('mBack').onclick = closeModal; $('mGo').onclick = () => { closeModal(); finish(false); };
}

async function finish(timeout) {
  if (S.done) return; S.done = true; leave(); clearInterval(S.timerId); window.onbeforeunload = null; closeModal();
  const used = (Date.now() - S.t0) / 1000;
  const n = S.items.length;
  const items = CONFIG.shuffleItems ? S.items.slice().sort((a, b) => ITEMS.findIndex(x => x.id === a.id) - ITEMS.findIndex(x => x.id === b.id)) : S.items;
  const pts = items.reduce((s, it) => s + (S.ans[it.id] === it.c ? 1 : 0), 0);
  const g = grade(pts);

  const rv = items.map((it, k) => {
    const ch = S.ans[it.id], ok = ch === it.c;
    return `<div class="rv"><h3><span class="mark ${ok ? 'ok' : 'no'}">${ok ? '✓ richtig' : (ch == null ? '– keine Antwort' : '✗ falsch')}</span>${it.title}</h3>
      ${ch != null && !ok ? `<div class="line"><b>Deine Antwort:</b> ${it.opts[ch][0]}<br><span style="color:#fca5a5">${it.opts[ch][1]}</span></div>` : ''}
      <div class="line"><b>Richtige Antwort:</b> ${it.opts[it.c][0]}<br><span style="color:#a7f3d0">${noR(it.opts[it.c][1])}</span></div>
      <details><summary>Aufgabe noch einmal ansehen</summary><div class="scen">${it.scen}</div><div class="q">${it.q}</div></details></div>`;
  }).join('');

  $('quiz').classList.add('hidden'); $('result').classList.remove('hidden');
  $('result').innerHTML = `
    <div class="kurs">${CONFIG.kurs}</div><h1>${CONFIG.title} – Auswertung</h1>
    ${timeout ? '<div class="fb no" style="margin-top:10px">Die Zeit ist abgelaufen – der Test wurde automatisch abgegeben.</div>' : ''}
    <div class="card">
      <div class="big">${pts} / ${n} Punkte${g ? `<span class="grade">Note ${g}</span>` : ''}</div>
      <div class="stats"><span>${Math.round(pts / n * 100)} % richtig</span>${CONFIG.timeMin ? `<span>Benötigte Zeit: ${fmt(Math.min(used, CONFIG.timeMin * 60))} von ${CONFIG.timeMin}:00 min</span>` : ''}</div>
      ${g ? '<p class="note">Die Note dient nur zur Orientierung und folgt dem Notenschlüssel des echten CA 2.</p>' : ''}
      <div id="sendstate" class="note"></div>
      <div class="btns" style="justify-content:flex-start"><button id="again">Neuer Durchgang</button></div>
    </div>
    <div class="card"><h2 style="margin:0 0 4px;font-size:18px">Alle Aufgaben mit Lösung</h2>${rv}</div>`;
  $('again').onclick = () => location.reload();
  window.scrollTo(0, 0);

  if (CONFIG.submit) {
    // Anonyme Rückmeldung an ein Google-Formular (Antworten landen in Google Forms / Google Tabellen)
    $('sendstate').textContent = 'Ergebnis wird anonym übermittelt …';
    const G = CONFIG.submit, body = new URLSearchParams();
    body.append(G.fields.test, CONFIG.title);
    body.append(G.fields.punkte, `${pts}/${n}`);
    body.append(G.fields.zeit, fmt(used) + (timeout ? ' (abgelaufen)' : ''));
    items.forEach(it => {
      const ch = S.ans[it.id];
      if (G.fields.items[it.id]) body.append(G.fields.items[it.id], `${ch == null ? 'keine Antwort' : ch === it.c ? 'richtig' : 'falsch (' + 'ABCD'[ch] + ')'} · ${fmt(S.tItem[it.id] || 0)}`);
    });
    try {
      // no-cors: Google beantwortet die Anfrage nicht lesbar – kommt kein Netzwerkfehler, ist sie angekommen
      await fetch(G.action, { method: 'POST', mode: 'no-cors', body });
      $('sendstate').textContent = '✓ Ergebnis wurde anonym übermittelt (ohne Namen, ohne Matrikelnummer).';
    } catch (e) { $('sendstate').textContent = 'Übermittlung hat nicht geklappt – kein Problem, deine Auswertung oben bleibt gültig.'; }
  }
}

document.addEventListener('keydown', e => {
  if ($('quiz').classList.contains('hidden') || $('modal').classList.contains('on')) return;
  const it = S.items[S.cur]; if (S.checked[it.id]) return;
  const k = 'abcd'.indexOf(e.key.toLowerCase()); const d = '1234'.indexOf(e.key);
  const idx = k >= 0 ? k : d; if (idx >= 0) choose(it.perm[idx]);
});
</script>
</body>
</html>
